document.getElementById("app").addEventListener("click", function(ev){
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  const reg = logDe(S.fecha);
  if (a === "vista") { S.vista = b.dataset.v; S.aviso = ""; }
  else if (a === "ir") { S.vista = "registro"; irA(b.dataset.f); return; }
  else if (a === "dia") { irA(iso(addDays(parseIso(S.fecha), +b.dataset.n))); return; }
  else if (a === "franja") { S.franja = b.dataset.v; }
  else if (a === "instalar") {
    if (promptInstalar) {
      const p = promptInstalar;
      promptInstalar = null;
      p.prompt();
      if (p.userChoice) p.userChoice.then(function(){ render(); });
    }
    return;
  }
  else if (a === "crearhuerfano") {
    S.vista = "alimentos"; abrirEd(null);
    S.ed.nombre = b.dataset.v; S.ed.cat = "Ingredientes";
    S.aviso = "Pon los datos de «"+b.dataset.v+"» y guarda. Las líneas ya registradas se contarán solas.";
  }
  else if (a === "quitarhuerfano") {
    const nom = b.dataset.v;
    let n = 0;
    Object.keys(S.ent).forEach(function (id) {
      if (!S.ent[id].borrado && S.ent[id].alimento === nom) { borrarEntrada(id); n++; }
    });
    guardar();
    S.aviso = "Quitadas "+n+(n===1?" línea de ":" líneas de ")+nom+".";
  }
  else if (a === "cerrarrecien") { S.recien = []; }

    let n = 0;

      const it = BY[nom]; if (!it) return;
      anotarPlato(S.fecha, nom, BASE(it), fr); n++;
    });
    guardar();
    S.recien = (S.recien || []).filter(x => lista.indexOf(x) < 0);
    S.aviso = n === 1 ? "Añadido a "+fr.toLowerCase()+" del "+nfDia(parseIso(S.fecha))+"."
                      : "Añadidos "+n+" a "+fr.toLowerCase()+" del "+nfDia(parseIso(S.fecha))+".";
  }
  else if (a === "pegar") {
    const num = v => { const x = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isNaN(x) ? 0 : x; };
    try {
      let d = JSON.parse(S.pegado);
      if (!Array.isArray(d)) d = [d];

      // 1) primero los que no tienen receta: son ingredientes o platos sueltos
      let nIng = 0, nPlat = 0, nRec = 0, saltados = [], sinIngr = [];
      const creados = [], porSubir = []; let recSubir = [];
      const alta = function (o) {
        const nom = String(o.nombre || "").trim();
        if (!nom) return null;
        if (BY[nom] && !o.reemplazar) { saltados.push(nom); return null; }
        const bs = num(o.base) || 1;
        const un = String(o.unidad || "raciones");
        const it = [nom, String(o.categoria || "Ingredientes"), num(o.kcal), num(o.prot), num(o.grasa),
                    num(o.hidratos), num(o.alc), num(o.verdura) + num(o.fruta) + num(o.vf), 0, "N.A.",
                    String(o.racion || (fmtCant(bs) + " " + un)), 3, bs, un, "propio"];
        ITEMS = ITEMS.filter(x => x[0] !== nom).concat([it]);
        reindex(); porSubir.push(it);
        return it;
      };
      d.filter(o => !o.receta).forEach(function (o) { const it = alta(o); if (it) { nIng++; creados.push(it[0]); } });

      // 2) luego los platos con receta, para que sus ingredientes ya existan
      d.filter(o => o.receta && o.receta.length).forEach(function (o) {
        const nom = String(o.nombre || "").trim();
        if (!nom) return;
        if (BY[nom] && !o.reemplazar) { saltados.push(nom); return; }
        // sumar los ingredientes
        let sk = 0, sp = 0, sg = 0, sc = 0, sa = 0, svf = 0, faltan = [];
        o.receta.forEach(function (r) {
          const ing = BY[String(r[0])];
          if (!ing) { faltan.push(String(r[0])); return; }
          const f = num(r[1]) / BASE(ing);
          sk += ing[2]*f; sp += ing[3]*f; sg += ing[4]*f; sc += ing[5]*f; sa += ing[6]*f;
          svf += (ing[7] + ing[8]) * f;
        });
        if (faltan.length) { sinIngr = sinIngr.concat(faltan.map(x => nom + " → " + x)); return; }
        // si das las kcal del plato, se escala para que cuadren; si no, manda la suma
        const kObj = num(o.kcal);
        const factor = (kObj > 0 && sk > 0) ? Math.round(kObj / sk * 10000) / 10000 : 1;
        const raciones = num(o.raciones) || 1;
        const it = [nom, String(o.categoria || "Comida"),
                    Math.round(sk*factor/raciones), Math.round(sp*factor/raciones*10)/10,
                    Math.round(sg*factor/raciones*10)/10, Math.round(sc*factor/raciones*10)/10,
                    Math.round(sa*factor/raciones*10)/10, Math.round(svf/raciones), 0,
                    String(o.taper || "Sí"),
                    String(o.racion || (raciones > 1 ? "1 ración de "+raciones : "1 ración")),
                    3, 1, "raciones", "propio"];
        ITEMS = ITEMS.filter(x => x[0] !== nom).concat([it]);
        porSubir.push(it);
        const fr = o.receta.map(r => [nom, String(r[0]), Math.round(num(r[1])/raciones*10)/10, factor]);
        recSubir = recSubir.concat(fr);
        RECETAS = RECETAS.filter(r => r[0] !== nom).concat(fr);
        nPlat++; nRec += o.receta.length; creados.push(nom);
        reindex();
      });

      S.recien = creados;
      S.franjaRecien = S.franjaRecien || S.franja;
      S.pegado = "";
      if (porSubir.length || recSubir.length) guardarPlatos(porSubir.map(filaCat), [], recSubir);
      const partes = [];
      if (nIng) partes.push(nIng + (nIng === 1 ? " alimento" : " alimentos"));
      if (nPlat) partes.push(nPlat + (nPlat === 1 ? " plato con receta" : " platos con receta") + " ("+nRec+" ingredientes)");
      S.aviso = partes.length ? "Creado: " + partes.join(" y ") + "."
                              : "No se ha creado nada nuevo.";
      if (saltados.length) S.aviso += " Ya existían y no se han tocado: " + saltados.slice(0,6).join(", ")
        + (saltados.length > 6 ? " y "+(saltados.length-6)+" más" : "") + ".";
      if (sinIngr.length) S.aviso += " NO se han creado por faltar ingredientes: " + sinIngr.slice(0,5).join("; ") + ".";
    } catch (err) {
      S.aviso = "Eso no es un JSON válido. Cópialo entero, con los corchetes.";
    }
  }
  else if (a === "crearhuerfano") {
    S.vista = "alimentos"; abrirEd(null);
    S.ed.nombre = b.dataset.v; S.ed.cat = "Ingredientes";
    S.aviso = "Pon los datos de «"+b.dataset.v+"» y guarda. Las líneas ya registradas se contarán solas.";
  }
  else if (a === "quitarhuerfano") {
    const nom = b.dataset.v;
    let n = 0;
    Object.keys(S.ent).forEach(function (id) {
      if (!S.ent[id].borrado && S.ent[id].alimento === nom) { borrarEntrada(id); n++; }
    });
    guardar();
    S.aviso = "Quitadas "+n+(n===1?" línea de ":" líneas de ")+nom+".";
  }
  else if (a === "cerrarrecien") { S.recien = []; }
  else if (a === "franjarecien") { S.franjaRecien = b.dataset.v; }
  else if (a === "addrecien") {
    const fr = S.franjaRecien || S.franja;
    const lista = b.dataset.v === "__todos__" ? (S.recien || []) : [b.dataset.v];

    });
    guardar();
    S.recien = (S.recien || []).filter(x => lista.indexOf(x) < 0);
    S.aviso = n === 1 ? "Añadido a "+fr.toLowerCase()+" del "+nfDia(parseIso(S.fecha))+"."
                      : "Añadidos "+n+" a "+fr.toLowerCase()+" del "+nfDia(parseIso(S.fecha))+".";
  }
  else if (a === "pegar") {
    let n = 0, malos = 0;
    try {
      let d = JSON.parse(S.pegado);
      if (!Array.isArray(d)) d = [d];
      const num = v => { const x = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isNaN(x) ? 0 : x; };
      d.forEach(function(o){
        const nom = String(o.nombre || "").trim();
        if (!nom || BY[nom]) { malos++; return; }
        const bs = num(o.base) || 1;
        const un = String(o.unidad || "raciones");
        ITEMS = ITEMS.concat([[nom, String(o.categoria || "Alimentos sueltos"),
          num(o.kcal), num(o.prot), num(o.grasa), num(o.hidratos), num(o.alc),
          num(o.verdura) + num(o.fruta), 0,
          "N.A.", String(o.racion || (fmtCant(bs)+" "+un)), 3, bs, un, "propio"]]); n++;
      });
      reindex(); guardar();
      S.pegado = "";
      S.aviso = n ? ("Creados "+n+(n===1?" alimento":" alimentos")+(malos?" ("+malos+" descartados: sin nombre o ya existían)":"")+".")
                  : "No se ha creado nada: revisa que los nombres no existan ya.";
    } catch (err) {
      S.aviso = "Eso no es un JSON válido. Copia y pega tal cual lo que te dé el chat, incluidos los corchetes.";
    }
  }
  else if (a === "pedirborrar") { S.borrarAlim = b.dataset.v || null; }
  else if (a === "confborrar") {
    const nom = b.dataset.v;
    ITEMS = ITEMS.filter(x => x[0] !== nom);
    RECETAS = RECETAS.filter(r => r[0] !== nom);
    S.borrarAlim = null; reindex();
    guardarPlatos([], [nom], []);
    S.aviso = "Borrado «"+nom+"».";
  }
  else if (a === "ednuevo") { S.vista = "alimentos"; abrirEd(null); S.aviso = ""; }
  else if (a === "ededit") { S.vista = "alimentos"; abrirEd(b.dataset.v); S.aviso = ""; }
  else if (a === "edno") { S.ed = null; S.aviso = ""; }
  else if (a === "edescalar") {
    const e = S.ed, bN = cantidad(e.base), bV = e.baseOrig;
    if (bN && bV) {
      const f = bN / bV, r2 = v => Math.round(((parseFloat(String(v==null?"":v).replace(",","."))||0) * f) * 10) / 10;
      ["kcal","prot","grasa","hidratos","alc","verdura","fruta"].forEach(function(k){ e[k] = r2(e[k]); });
      e.baseOrig = bN;
      S.aviso = "Datos reescalados a "+fmtCant(bN)+" "+(e.unidad||"")+".";
    }
  }
  else if (a === "edok") {
    const e = guardarEd();
    if (e) S.aviso = e; else { S.aviso = "Guardado «"+String(S.ed.nombre).trim()+"»."; S.ed = null; }
  }
  else if (a === "edborrar") {
    const nom = S.ed.nombreOrig;
    ITEMS = ITEMS.filter(x => x[0] !== nom);
    reindex(); S.ed = null;
    guardarPlatos([], [nom], []);
    S.aviso = "Borrado «"+nom+"». Los días donde estaba registrado dejan de sumarlo.";
  }
  else if (a === "crear") {
    S.vista = "alimentos"; abrirEd(null);
    S.ed.nombre = b.dataset.v || S.q.trim();
    S.q = ""; S.aviso = "";
  }
  else if (a === "add") {
    const it = BY[b.dataset.v];
    anotarPlato(S.fecha, b.dataset.v, BASE(it), S.franja); S.q = ""; guardar();
  }
  else if (a === "mover") { S.moverId = (S.moverId === b.dataset.v) ? null : b.dataset.v; }
  else if (a === "moverA") { S.moverId = null; tocar(b.dataset.v, { franja: b.dataset.f }); return; }
  else if (a === "moverGrupoA") {
    const g = b.dataset.v, fr = b.dataset.f;
    S.moverId = null;
    const ids = Object.keys(S.ent).filter(id => S.ent[id].grupo === g && S.ent[id].fecha === S.fecha);
    ids.forEach(function (id) { S.ent[id].franja = fr; });
    render();
    Promise.all(ids.map(id => pedir({ accion:"editar", id:id, cambios:{ franja:fr } }, "Moviendo…")));
    return;
  }
  else if (a === "del") { borrarEntrada(b.dataset.id); return; }
  else if (a === "delgrupo") {
    const g = b.dataset.v;
    reg.forEach(function(e){ if (e[5] === g) borrarEntrada(e[3]); });
    guardar();
  }
  else if (a === "plegargrupo") {
    S.cerrados = S.cerrados || {};
    S.cerrados[g_(b.dataset.v)] = !S.cerrados[g_(b.dataset.v)];
  }
  else if (a === "plegarplan") { S.params.planAbierto = !S.params.planAbierto; guardar(); }
  else if (a === "plegarsemana") { S.params.semanaAbierta = !S.params.semanaAbierta; guardar(); }
  else if (a === "ordsem") {
    const c = b.dataset.v;
    S.ordSem = (S.ordSem && S.ordSem.col === c) ? { col:c, dir:-S.ordSem.dir }
                                                : { col:c, dir: c === "plato" ? 1 : -1 };
  }
  else if (a === "copiara") { S.copiarA = b.dataset.v || null; S.guardarPlato = null; S.guardarVar = null; S.aviso = ""; }
  else if (a === "hacercopia") {
    const dest = S.fechaCopia || iso(addDays(parseIso(S.fecha), 1));
    const n = copiarFranjaA(b.dataset.v, dest);
    S.copiarA = null;
    S.aviso = "Copiadas "+n+(n===1?" línea al ":" líneas al ")+nfDia(parseIso(dest))+".";
  }
  else if (a === "guardarvar") {
    S.guardarVar = b.dataset.v || null; S.copiarA = null; S.guardarPlato = null; S.aviso = "";
    if (S.guardarVar) S.nomPlato = nombreVariante((S.grupos && S.grupos[S.guardarVar]) || "Plato");
  }
  else if (a === "crearvar") {
    const err = grupoComoPlato(b.dataset.v, S.nomPlato);
    if (err) S.aviso = err;
    else { S.aviso = "Guardado «"+String(S.nomPlato).trim()+"»."; S.guardarVar = null; S.nomPlato = ""; }
  }
  else if (a === "guardarplato") { S.guardarPlato = b.dataset.v || null; S.copiarA = null; S.guardarVar = null; S.nomPlato = ""; S.aviso = ""; }
  else if (a === "crearplato") {
    const err = franjaComoPlato(S.guardarPlato, S.nomPlato);
    if (err) S.aviso = err;
    else { S.aviso = "Guardado «"+String(S.nomPlato).trim()+"». Ya lo tienes en el buscador."; S.guardarPlato = null; S.nomPlato = ""; }
  }
  else if (a === "sug") { S.sug = b.dataset.v; }
  else if (a === "addprot") {
    const c = parseFloat(b.dataset.c);
    anotarPlato(S.fecha, b.dataset.v, isNaN(c) ? BASE(BY[b.dataset.v]) : c, S.franja);
    guardar();
  }
  else if (a === "addsug") {
    anotarPlato(S.fecha, b.dataset.v, BASE(BY[b.dataset.v]), b.dataset.f); guardar();
  }
  else if (a === "addplan") {
    const c = parseFloat(b.dataset.c);
    anotarPlato(S.fecha, b.dataset.v, isNaN(c) ? BASE(BY[b.dataset.v]) : c, b.dataset.f); guardar();
  }
  else if (a === "cargarplan") {
    const pd = PLAN[planIndex(parseIso(S.fecha))];
    const nuevas = [];
    pd.items.forEach(function(x){
      if (!reg.some(e => e[0] === x[0] && e[2] === x[1]))
        nuevas.push([x[0], x.length > 2 ? x[2] : BASE(BY[x[0]]), x[1]]);
    });
    nuevas.forEach(function(n){ anotarPlato(S.fecha, n[0], n[1], n[2]); });
    guardar();
  }
  else if (a === "peso") {
    const el = document.getElementById("pesohoy");
    const v = parseFloat((el.value || "").replace(",", "."));
    if (!isNaN(v) && v > 30 && v < 250) {
      const f = iso(new Date());
      ponerPeso(f, v); return;
    }
  }
  else if (a === "borrardia") {
    reg.forEach(function(e){ borrarEntrada(e[3]); });
    guardar(); S.aviso = "Vaciado el día "+nfDia(parseIso(S.fecha))+".";
  }
  else if (a === "exportar") {
    const datos = { version:4, exportado:new Date().toISOString(), params:S.params,
                    ent:S.ent, pesos:S.pesos, catalogo:ITEMS };
    const url = URL.createObjectURL(new Blob([JSON.stringify(datos, null, 1)], { type:"application/json" }));
    const link = document.createElement("a");
    link.href = url; link.download = "registro-comidas-"+iso(new Date())+".json";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    S.aviso = "Copia descargada.";
  }
  else if (a === "importar") { document.getElementById("ficheroImport").click(); return; }
  render();
});

document.getElementById("app").addEventListener("input", function(ev){
  const el = ev.target;
  if (el.id === "buscar") { S.q = el.value; render(); return; }
  if (el.id === "qalim") { S.qa = el.value; render(); return; }
  if (el.id === "nomplato") { S.nomPlato = el.value; return; }
  if (el.id === "fechaCopia") { S.fechaCopia = el.value; return; }
  if (el.id === "pegado") { S.pegado = el.value; render(); return; }
  if (el.dataset.sync) { S.sync[el.dataset.sync] = el.value.trim(); guardar(); render(); return; }
  if (el.dataset.mover) { moverFranja(el); return; }
  if (el.dataset.movergrupo) {
    const g = el.dataset.movergrupo;
    let n = 0;
    Object.keys(S.ent).forEach(function (id) {
      const e = S.ent[id];
      if (!e.borrado && e.grupo === g && e.fecha === S.fecha && e.franja !== el.value) {
        tocar(id, { franja: el.value }); n++;
      }
    });
    if (n) { guardar(); render(); }
    return;
  }
  if (el.dataset.ed && S.ed) { S.ed[el.dataset.ed] = el.value; return; }   // sin repintar: se perdía el cursor
  if (el.dataset.rac != null) {
    const id = el.dataset.rac, v = cantidad(el.value);
    if (v == null) return;                       // a medio escribir: no se toca nada
    if (S.ent[id]) S.ent[id].cant = v;           // se actualiza en pantalla sin repintar
    pintarPanel();
    clearTimeout(esperaCant[id]);
    esperaCant[id] = setTimeout(function () {
      delete esperaCant[id];
      pedir({ accion:"editar", id:id, cambios:{ cant:v } }, "Guardando…");
    }, 800);
    return;
  }
  if (el.dataset.par) {
    const k = el.dataset.par;
    S.params[k] = k === "planStart" ? el.value : (cantidad(el.value) || parseFloat(String(el.value).replace(",", ".")) || 0);
    guardar();
    clearTimeout(esperaParams);
    esperaParams = setTimeout(function () { guardarParams(); render(); }, 900);
  }
});

document.getElementById("app").addEventListener("keydown", function(ev){
  if (ev.key === "Enter" && ev.target.id === "pesohoy") {
    const v = parseFloat((ev.target.value || "").replace(",", "."));
    if (!isNaN(v) && v > 30 && v < 250) {
      const f = iso(new Date());
      ponerPeso(f, v); return;
    }
  }
});

function moverFranja(el) {
  const id = el.dataset.mover;
  if (!id || !S.ent[id] || S.ent[id].franja === el.value) return false;
  tocar(id, { franja: el.value });
  guardar(); render();
  return true;
}

document.getElementById("app").addEventListener("change", function(ev){
  if (ev.target.dataset && ev.target.dataset.mover) { moverFranja(ev.target); return; }
  if (ev.target.dataset && ev.target.dataset.movergrupo) {
    const g = ev.target.dataset.movergrupo;
    let n = 0;
    Object.keys(S.ent).forEach(function (id) {
      const e = S.ent[id];
      if (!e.borrado && e.grupo === g && e.fecha === S.fecha && e.franja !== ev.target.value) {
        tocar(id, { franja: ev.target.value }); n++;
      }
    });
    if (n) { guardar(); render(); }
    return;
  }
  if (ev.target.id !== "ficheroImport") return;
  const f = ev.target.files[0]; if (!f) return;
  const lector = new FileReader();
  lector.onload = function(){
    try {
      const d = JSON.parse(lector.result);
      if (!d || typeof d !== "object" || (!d.ent && !d.log)) throw new Error("formato");
      S.params = Object.assign({}, DEFAULTS, d.params || {});
      S.pesos = d.pesos || {};
      if (d.catalogo && d.catalogo.length) { ITEMS = d.catalogo; }
      if (d.ent) S.ent = d.ent;
      else {   // copia antigua por días
        S.ent = {};
        Object.keys(d.log || {}).forEach(function(f){
          (d.log[f] || []).forEach(function(e){
            const id = uid();
            S.ent[id] = { id:id, fecha:f, franja:e[2], alimento:e[0], cant:e[1], ts:Date.now(), borrado:0 };
          });
        });
      }
      reindex(); guardar();
      S.aviso = "Copia cargada: "+fechasConRegistro().length+" días de registro y "+ITEMS.length+" alimentos.";
    } catch(e) { S.aviso = "Ese archivo no es una copia válida. Debe ser el JSON que genera «Descargar copia»."; }
    render();
  };
  lector.readAsText(f);
});

render();
cargar("Cargando…");

/* No se recarga al volver a la pestaña: movía el foco y la página de sitio.
   Se relee al abrir la app, al recuperar la red y cuando tú lo pides en Ajustes. */
window.addEventListener("online", function () { cargar("Reconectando…"); });
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); promptInstalar = e;
  if (S.vista === "ajustes") render();
});
window.addEventListener("appinstalled", function () { promptInstalar = null; render(); });
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function () {
      swRegistrado = true;
      if (S.vista === "ajustes") render();
    }).catch(function () { swRegistrado = false; });
  });
}

</script>
