<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de comidas — Carlos</title>
<meta name="theme-color" content="#0E1815">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comidas">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBE6; --surface:#FFFFFF; --ink:#0E1815; --soft:#2C3B36; --line:#A9B5AE;
  --pine:#0A6B4C; --quince:#8A5410; --slate:#2F536F; --pimenton:#B3271A; --mint:#12A277;
  --verde:#0A6B4C; --rojo:#B3271A;
  --verde-claro:#6FE0AC; --rojo-claro:#FF9E8B; --hero-soft:#C6D2CC;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;color:var(--ink);font-size:16px;
  background:var(--bg);min-height:100vh;padding:18px 16px 60px;letter-spacing:-.01em;
  -webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:800;letter-spacing:-.03em;line-height:.92}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--soft);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:16px;margin-bottom:12px}
.hero{background:var(--ink);color:#EDF0EC;border:none;padding:18px}
.hero .eyebrow{color:var(--hero-soft)}
.big{font-size:clamp(38px,10vw,58px)}
.gauge{display:flex;gap:5px;align-items:flex-end;height:82px;margin:14px 0 6px}
.col{flex:1;position:relative;height:100%;background:#22302B;border-radius:2px 2px 0 0;
  cursor:pointer;overflow:hidden;border:none;padding:0}
.col:focus-visible{outline:2px solid #EDF0EC;outline-offset:2px}
.fill{position:absolute;left:0;right:0;bottom:0;transition:height .45s cubic-bezier(.2,.7,.2,1)}
.tick{position:absolute;left:0;right:0;height:2px;background:#FFFFFF;opacity:.85}
.collab{display:flex;gap:5px}
.collab span{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  color:var(--hero-soft);letter-spacing:.04em}
.collab span.on{color:#FFFFFF;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bar{height:10px;background:#CFD8D2;border-radius:99px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.metric{margin-bottom:11px}
.metric .lab{font-size:14.5px;color:var(--ink);font-weight:500}
.metric .val{font-family:'IBM Plex Mono',monospace;font-size:14.5px;font-weight:600}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--ink);color:#FFFFFF;border:none;border-radius:2px;padding:10px 15px;
  font-size:14px;font-weight:600}
.btn.ghost{background:#FFFFFF;color:var(--ink);border:1.5px solid var(--ink)}
.btn.tiny{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.tabs{display:flex;gap:2px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{background:none;border:none;padding:10px 14px;font-size:14.5px;color:var(--soft);
  border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--pine)}

input,select{font-family:inherit;font-size:15px;padding:8px 9px;border:1px solid var(--line);
  border-radius:2px;background:#fff;color:var(--ink);width:100%}
input:focus-visible{outline:2px solid var(--pine);outline-offset:-1px}
.logrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logrow:last-child{border-bottom:none}
/* los controles van en una rejilla de anchos fijos: así todas las filas quedan alineadas
   aunque la unidad sea "g" o "hamburguesas" */
.logrow .info{flex:1 1 230px;min-width:0}
.logrow .ctrl{display:grid;grid-template-columns:64px 96px 130px 76px;gap:6px;align-items:center;
  flex:0 0 auto;margin-left:auto}
.logrow .ctrl>*{min-width:0}
.logrow .ctrl input{width:100%;text-align:center;font-weight:700;font-size:16px;padding:8px 3px}
.logrow .ctrl select{width:100%}
.logrow .uni{font-size:13.5px;font-weight:600;line-height:1.15;overflow-wrap:break-word;hyphens:auto}
.logrow .ctrl .btn{width:100%;padding:6px 4px}
@media (max-width:640px){
  .logrow{gap:6px}
  .logrow .info{flex:1 1 100%}
  /* dos filas: cantidad + unidad + quitar arriba, franja abajo a lo ancho */
  .logrow .ctrl{margin-left:0;width:100%;gap:6px 8px;
    grid-template-columns:62px minmax(0,1fr) 84px;
    grid-template-areas:"cant uni quitar" "franja franja franja"}
  .logrow .ctrl input{grid-area:cant;font-size:16px;padding:9px 2px}
  .logrow .uni{grid-area:uni;font-size:13px}
  .logrow .ctrl select{grid-area:franja;width:100%}
  .logrow .ctrl .btn{grid-area:quitar}
}
.restante{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:800;
  letter-spacing:-.02em;font-size:26px;line-height:1}
.restlab{font-size:14px;font-weight:600;margin-top:3px}
/* ---- bloques por franja en el registro del día ---- */
.grupo{border:1.5px solid var(--ink);border-radius:3px;margin:12px 0;overflow:hidden}
.grupo .gcab{background:var(--ink);color:#fff;padding:9px 13px;display:flex;
  justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.grupo .gnom{font-family:'Bricolage Grotesque','Instrument Sans',sans-serif;font-weight:800;
  font-size:17px;letter-spacing:-.02em}
.grupo .gsub{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:#fff}
.grupo .gcue{padding:3px 13px 7px}
.grupo .logrow:first-child{padding-top:9px}
.res{max-height:250px;overflow-y:auto;border:1px solid var(--line);border-top:none;background:#fff}
.res button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px;
  font-size:14.5px;border-bottom:1px solid var(--line)}
.res button:hover,.res button:focus-visible{background:#DCE7E0}
.chip{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:3px 7px;border-radius:2px;
  background:#DCE7E0;color:var(--ink);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.note{font-size:13.5px;color:var(--ink);line-height:1.55}
.aviso{background:#FBEDE6;border:1.5px solid #C98A66;color:#6B2F16;font-size:14px;
  padding:9px 11px;border-radius:2px;margin-bottom:12px;line-height:1.45}
.veredicto{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.05em;
  padding:2px 6px;border-radius:2px;text-transform:uppercase;white-space:nowrap}
.v-cabe{background:#C7E7D6;color:#064B33}
.v-justo{background:#F6E2B8;color:#6B3F06}
.v-no{background:#F7CFC9;color:#8A1C11}
table{width:100%;border-collapse:collapse;font-size:14px}
.btnf{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:3px;font:inherit;font-size:11.5px;font-weight:600;padding:3px 8px;cursor:pointer;white-space:nowrap}
.btnf:hover{background:rgba(255,255,255,.15)}
/* aviso de que está hablando con la hoja */
.cargando{position:fixed;left:50%;transform:translateX(-50%);bottom:-70px;z-index:60;
  display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:4px;font-size:14px;font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.28);transition:bottom .18s ease-out;pointer-events:none}
.cargando.on{bottom:22px}
.rueda{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:gira .7s linear infinite;flex:0 0 auto}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rueda{animation-duration:2s}}
.platoc{border:1.5px solid var(--line);border-radius:3px;margin:9px 0;background:#F7F9F6}
.platoh{display:flex;align-items:center;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line)}
.platoh .info{flex:1 1 auto;min-width:0}
.platob{background:none;border:none;padding:0;font:inherit;font-size:15px;font-weight:700;color:var(--ink);
  cursor:pointer;text-align:left}
.btnv{background:var(--verde);border:none;color:#fff;border-radius:3px;font:inherit;font-size:11.5px;font-weight:700;padding:4px 9px;cursor:pointer;white-space:nowrap}
.iconb{background:none;border:none;font-size:15px;line-height:1;cursor:pointer;padding:3px 6px;border-radius:3px}
.iconb:hover{background:#E2E8E3}
.quitax{background:none;border:none;font-size:17px;line-height:1;color:var(--rojo);cursor:pointer;
  padding:3px 6px;border-radius:3px;flex:0 0 auto}
.quitax:hover{background:#F7CFC9}
.ctrl2{display:grid;grid-template-columns:64px 74px 122px 34px;gap:6px;align-items:center;flex:0 0 auto;margin-left:auto}
.ctrl2.sinfr{grid-template-columns:64px 74px 34px}
.ctrl2>*{min-width:0}
.ctrl2 input{width:100%;text-align:center;font-weight:700;font-size:16px;padding:8px 3px}
.ctrl2 select{width:100%}
.ctrl2 .uni{font-size:13px;font-weight:600;line-height:1.15;overflow-wrap:break-word}
.platoc>.ingr:only-child{border-bottom:none}
@media (max-width:640px){
  .ctrl2{margin-left:0;width:100%;gap:6px 8px;
    grid-template-columns:62px minmax(0,1fr) 34px;
    grid-template-areas:"cant uni quitar" "franja franja franja"}
  .ctrl2 input{grid-area:cant}
  .ctrl2 .uni{grid-area:uni}
  .ctrl2 select{grid-area:franja;width:100%}
  .ctrl2 .iconb{background:none;border:none;font-size:15px;line-height:1;cursor:pointer;padding:3px 6px;border-radius:3px}
.iconb:hover{background:#E2E8E3}
.quitax{grid-area:quitar}
  .ctrl2.sinfr{grid-template-columns:62px minmax(0,1fr) 34px;grid-template-areas:"cant uni quitar"}
  .ingr .info{flex:1 1 100%}
}
.ctrlp{display:flex;align-items:center;gap:7px;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.ctrlp select{width:122px;font-size:14px;padding:6px 7px}
@media (max-width:640px){
  .platoh{flex-wrap:wrap}
  .platoh .info{flex:1 1 100%}
  .ctrlp{width:100%;justify-content:flex-start;margin-top:7px}
  .ctrlp select{flex:1 1 auto;width:auto;min-width:0}
}
.ingr{display:flex;align-items:center;gap:9px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ingr:last-child{border-bottom:none}
.ingr .info{flex:1 1 150px;min-width:0}
.ordth{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;text-align:inherit}
.ordth:hover{text-decoration:underline}
th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink);font-weight:600;padding:8px 8px 8px 0;
  border-bottom:2px solid var(--ink)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
/* ---- panel de lo que queda por comer ---- */
#restante{position:fixed;z-index:80;background:var(--ink);color:#fff;border-radius:3px;
  box-shadow:0 6px 24px rgba(14,24,21,.28);overflow:hidden;box-sizing:border-box}
#restante .rt{font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--hero-soft);font-weight:500}
#restante .rk{font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;font-weight:600;
  letter-spacing:-.02em;line-height:.95;font-variant-numeric:tabular-nums}
#restante .rf{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:7px 0;border-top:1px solid #2C3B36}
#restante .rn{font-size:14px;font-weight:500;color:#E4EAE6}
#restante .rv{font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;font-size:13.5px;font-weight:600;
  white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
#restante .rc{display:block;font-weight:600;font-size:12.5px}
#restante .obj{color:var(--hero-soft);font-weight:500}
#restante .ru{font-family:'Instrument Sans',sans-serif;font-size:16px;font-weight:600}
#restante .rt2{font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;font-size:12.5px;font-weight:500;
  color:var(--hero-soft);margin-top:3px}
.rok{color:var(--verde-claro)} .rno{color:var(--rojo-claro)}
/* pantalla ancha: columna flotante a la derecha */
@media (min-width:1240px){
  #restante{top:88px;right:22px;width:300px;padding:13px 15px}
  #restante .rejilla{grid-template-columns:1fr}
  #restante .rf-kcal{grid-column:auto}
  #restante .rk{font-size:38px}
}
/* pantalla estrecha: barra inferior compacta */
@media (max-width:1239px){
  body{padding-bottom:132px}
  #restante{left:0;right:0;bottom:0;border-radius:0;padding:10px 16px 12px;
    box-shadow:0 -6px 20px rgba(14,24,21,.3)}
  #restante .cab{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  #restante .rk{font-size:27px}
  #restante .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;margin-top:5px}
  #restante .rf{border:none;padding:1px 0;gap:6px;justify-content:flex-start}
  #restante .rn{font-size:12px;flex:0 0 auto}
  #restante .rv{font-size:12px;margin-left:auto}
  #restante .rc{display:inline;font-size:12px}
}
/* campo con la unidad pegada a la derecha del recuadro */
.campo .fila{display:flex;align-items:center;gap:7px;margin-top:5px}
.campo .fila input,.campo .fila select{flex:1 1 auto;min-width:0}
.campo .fila .u{flex:0 0 auto;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.campo .pie{font-size:12px;color:var(--ink);margin-top:3px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.bloqueo{position:fixed;inset:0;background:var(--ink);color:#fff;z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.bloqueo .caja{max-width:560px}
.bloqueo h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.03em;
  font-size:clamp(30px,7vw,44px);line-height:1.02;margin:0 0 14px}
.bloqueo p{font-size:16px;line-height:1.55;color:#E4EAE6;margin:0 0 14px}
.bloqueo .grande{background:#fff;color:var(--ink);border:none;border-radius:3px;
  padding:16px 22px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;margin-bottom:9px}
.bloqueo .sec{background:transparent;color:#fff;border:2px solid #fff;border-radius:3px;
  padding:13px 20px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;width:100%;margin-bottom:9px}
.bloqueo .peque{background:none;border:none;color:#AFC0B8;text-decoration:underline;
  font-family:inherit;font-size:13.5px;cursor:pointer;padding:8px 0}
.bloqueo code{font-family:'IBM Plex Mono',monospace;background:#25332E;padding:2px 6px;border-radius:2px;
  font-size:14px;word-break:break-all}
.bloqueo .ok{color:#6FE0AC;font-weight:700}

/* ---------- cabecera del día ---------- */
.hdr-dia{display:flex;align-items:center;gap:10px;padding:11px 12px}
.hdr-dia .hdr-txt{flex:1;min-width:0;text-align:center}
.hdr-fecha{font-size:17px;font-weight:700;line-height:1.2}
.hdr-obj{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--soft);margin-top:2px}
.hdr-rest{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:700;
  white-space:nowrap;flex:0 0 auto;text-align:right}
.hdr-rest .hdr-u{font-size:11px;font-weight:600;margin-left:3px;color:var(--soft)}
.hdr-rest.rok{color:var(--verde)} .hdr-rest.rno{color:var(--rojo)}
.card.err{border-color:var(--rojo)}

/* ---------- medidor semanal, más bajo ---------- */
.hero .mdrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.mdnum{font-size:30px;font-weight:700;line-height:1}
.mdnum .mdu{font-size:13px;font-weight:600;margin-left:6px}
.mdcons{font-size:15px;font-weight:700;color:#fff;white-space:nowrap}
.hero .gauge{height:74px;margin-top:10px}
.hero .collab{margin-top:4px}
.col[data-hoy]{box-shadow:inset 0 0 0 1.5px #EDF0EC}

/* ---------- controles compactos de cada línea ---------- */
.ctrl2{display:grid;grid-template-columns:56px 52px 38px 30px;gap:5px;align-items:center;
  flex:0 0 auto;margin-left:auto}
.ctrl2>*{min-width:0}
.ctrl2 input.cant-input{width:100%;text-align:center;font-weight:700;font-size:14px;padding:5px 2px;
  border-radius:3px}
.ctrl2 .uni{font-size:12px;font-weight:600;line-height:1.1;overflow-wrap:break-word}
.franja-btn{background:none;border:1.4px solid var(--line);border-radius:3px;font:inherit;
  font-size:15px;line-height:1;font-weight:700;padding:5px 3px;cursor:pointer;color:var(--ink);width:100%}
.franja-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ctrl2 .quitax{padding:2px 4px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:7px 10px 9px;background:#fff;
  border-top:1px solid var(--line)}
.chip{background:none;border:1.4px solid var(--line);border-radius:3px;font:inherit;font-size:12.5px;
  font-weight:600;padding:5px 9px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card .row>.chev{align-self:flex-start}
.chev{background:none;border:1.4px solid var(--line);border-radius:3px;font-size:15px;line-height:1;
  padding:4px 9px;cursor:pointer;color:var(--ink);flex:0 0 auto}
.chev:hover{background:#E2E8E3}
.lnk{background:none;border:none;padding:0;font:inherit;font-weight:600;color:var(--pine);
  cursor:pointer;text-decoration:underline}

/* ---------- tabla de la semana ---------- */
.tsem{font-size:13.5px}
.tsem th,.tsem td{padding:5px 7px}
.tsem tr.hoy{background:#EDF2EE;font-weight:700}
.tsem tfoot td{border-top:2px solid var(--ink);font-weight:700}
.tsem .obj{color:var(--soft)}
.tsem .rojo{color:var(--rojo)} .tsem .verde{color:var(--verde)}
.filaf{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid var(--line)}
.filaf .ff{font-weight:700;flex:0 0 80px}
.filaf .fp{font-size:14px;flex:1}

/* ---------- panel flotante, más bajo ---------- */
#restante .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px}
#restante .rf{display:flex;justify-content:space-between;gap:9px;align-items:baseline;padding:2px 0;min-width:0;border-top:none}
#restante .rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#restante .rf-kcal{grid-column:1 / -1;border-bottom:1px solid rgba(255,255,255,.16);
  padding-bottom:4px;margin-bottom:3px}
#restante .rf-kcal .rn{font-size:13.5px;font-weight:700}
#restante .rf-kcal .rv{font-size:16px}
#restante .rn{font-size:12px;flex:0 0 auto}
#restante .rv{font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;font-size:12.5px;font-weight:600;
  white-space:nowrap;margin-left:auto;font-variant-numeric:tabular-nums}
#restante .obj{color:var(--hero-soft);font-weight:500}

@media (max-width:640px){

/* Acepta "1,5", "1.5", "50/33", "3*0,5". Solo dígitos, punto, coma, / y *. */
/* Acepta coma o punto como separador DECIMAL, indistintamente. Nunca como millares:
   «1.234» y «1,234» son los dos 1,234. Admite además fracciones: 1/2, 3/4. */
function cantidad(txt) {
  const t = String(txt == null ? "" : txt).replace(/,/g, ".").replace(/\s+/g, "");
  if (!t) return null;
  if (!/^[0-9./*]+$/.test(t)) return null;
  if (/[/*]{2}|^[/*]|[/*]$/.test(t)) return null;
  try {
    const v = Function('"use strict";return (' + t + ')')();
    if (typeof v !== "number" || !isFinite(v) || v <= 0 || v > 100000) return null;
    return Math.round(v * 1000) / 1000;
  } catch (e) { return null; }
}
const fmtCant = n => (Math.round(n*1000)/1000).toString().replace(".", ",");

const Store = (function(){
  let modo = "localStorage";
  const mem = {};
  try {
    localStorage.setItem("__probe__","1"); localStorage.removeItem("__probe__");
  } catch(e) { modo = "memoria"; }
  return {
    modo: () => modo,
    get(k, def) {
      try {
        const v = modo === "localStorage" ? localStorage.getItem(k) : mem[k];
        return v == null ? def : JSON.parse(v);
      } catch(e) { return def; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      try { if (modo === "localStorage") localStorage.setItem(k, s); else mem[k] = s; return true; }
      catch(e) { mem[k] = s; return false; }
    }
  };
})();

/* El estado guardado puede venir de una versión anterior de la app, con menos campos.
   Se completa lo que falte para que nada reviente al leerlo. */

/* ---------- acceso al registro por entradas ---------- */
const g_ = x => x;
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 9));
function logDe(fecha) {
  const out = [];
  Object.keys(S.ent).forEach(function (id) {
    const e = S.ent[id];
    if (e.borrado || e.fecha !== fecha) return;
    out.push([e.alimento, e.cant, e.franja, id, e.ts, e.grupo || "", e.factor || 1]);
  });
  out.sort(function (a, b) {
    const ia = FRANJAS.indexOf(a[2]), ib = FRANJAS.indexOf(b[2]);
    return ia !== ib ? ia - ib : a[4] - b[4];
  });
  return out;
}
const BASE = it => (it && it[12]) || 1;
const UNI  = it => (it && it[13]) || "raciones";
const factor = (nombre, cant) => cant / BASE(BY[nombre]);
function reindex() {
  Object.keys(BY).forEach(k => { delete BY[k]; });
  ITEMS.forEach(i => BY[i[0]] = i);
}
const fechasConRegistro = () => {
  const f = {};
  Object.keys(S.ent).forEach(function (id) { if (!S.ent[id].borrado) f[S.ent[id].fecha] = 1; });
  return Object.keys(f);
};

const catalogo = () => ITEMS;


/* ---------- datos derivados ---------- */
if (!S.params.planStart) S.params.planStart = iso(mondayOf(new Date()));

/* ---------- cálculo ---------- */
function objetivos(p) {
  const tmb = Math.round(10*p.peso + 6.25*p.altura - 5*p.edad + 5);
  const get = Math.round(tmb * p.factor);
  const medio = get - p.deficit;
  const semanal = medio * 7;
  const lab = Math.round(medio - p.ajusteLab);
  const fin = Math.round((semanal - lab*5)/2);
  return { tmb, get, medio, semanal, lab, fin,
    prot: Math.round(p.peso*p.protGkg), grasa: Math.round(p.peso*p.grasaGkg),
    hidratos: Math.round((medio - p.peso*p.protGkg*4 - p.peso*p.grasaGkg*9)/4) };
}
function totales(reg) {
  const t = { kcal:0, prot:0, grasa:0, hidratos:0, alc:0, verdura:0, fruta:0 };
  (reg||[]).forEach(function(e){
    const it = BY[e[0]]; if (!it) return;
    const r = (e[1] / BASE(it)) * (e[6] == null ? 1 : e[6]);
    t.kcal+=it[2]*r; t.prot+=it[3]*r; t.grasa+=it[4]*r; t.hidratos+=it[5]*r;
    t.alc+=it[6]*r; t.verdura+=it[7]*r; t.fruta+=it[8]*r;
  });
  return t;
}
function planIndex(d) {
  if (!S.params.planStart) return null;
  const dias = Math.round((d - parseIso(S.params.planStart)) / 86400000);
  return ((dias % 28) + 28) % 28;
}
function franjaDe(nombre) {
  const c = BY[nombre] ? BY[nombre][1] : "";
  if (c === "Post-entreno 6:30" || c === "Desayuno" || c === "Suplemento") return "Desayuno";
  if (c === "Hamaiketako") return "Hamaiketako";
  if (c === "Aperitivo / Merienda") return "Merienda";
  if (c === "Comida") return "Comida";
  if (c === "Cena" || c === "Bebida") return "Cena";
  if (c === "Postre") return "Comida";
  return "Extras";
}

/* ---------- componentes de render ---------- */
function metrica(label, valor, obj, unidad, modo) {
  const pct = obj ? Math.min(100, (valor/obj)*100) : 0;
  const ok = modo === "min" ? valor >= obj : !(obj && valor > obj);
  const col = ok ? "var(--verde)" : "var(--rojo)";
  return '<div class="metric"><div class="row"><span class="lab">'+esc(label)+'</span>'
    + '<span class="val" style="color:'+col+'">'+fmt(valor)
    + '<span style="color:var(--ink);font-weight:500"> / '+fmt(obj)+' '+unidad+'</span></span></div>'
    + '<div class="bar"><i style="width:'+pct+'%;background:'+col+'"></i></div></div>';
}

function hero() {
  const o = objetivos(S.params);
  const lunes = mondayOf(parseIso(S.fecha));
  let kcalSem = 0, cols = "", labs = "";
  for (let i = 0; i < 7; i++) {
    const dd = addDays(lunes, i), k = iso(dd);
    const kc = totales(logDe(k)).kcal;
    const objD = esFinde(dd) ? o.fin : o.lab;
    kcalSem += kc;
    /* La altura de cada barra ES el objetivo de ese día. Llena = objetivo justo,
       desbordada = te pasaste. Sin línea de referencia: no hace falta. */
    const alto = Math.min(112, (kc / objD) * 100);
    cols += '<button class="col" data-act="ir" data-f="'+k+'" aria-label="'+esc(nfDia(dd))+': '+fmt(kc)+' kcal"'
      + (k === S.fecha ? ' data-hoy="1"' : '')+'>'
      + '<span class="fill" style="height:'+alto+'%;background:'+(kc>objD?"var(--pimenton)":"var(--mint)")+'"></span>'
      + '</button>';
    labs += '<span class="'+(k===S.fecha?"on":"")+'">'+DIAS[i].charAt(0).toUpperCase()+'</span>';
  }
  const restan = o.semanal - kcalSem;
  const col = restan < 0 ? "var(--rojo-claro)" : "var(--verde-claro)";
  return '<div class="card hero" id="medidor">'
    + '<span class="eyebrow">Sem. '+lunes.getDate()+'-'+MESES[lunes.getMonth()].slice(0,3)
    + ' · '+fmt(o.semanal)+' kcal semanales</span>'
    + '<div class="mdrow">'
    + '<div class="mdnum mono" style="color:'+col+'">'+(restan<0?"−":"")+fmt(Math.abs(restan))
    + '<span class="mdu">kcal '+(restan<0?"de más":"quedan")+'</span></div>'
    + '<div class="mdcons mono">'+fmt(kcalSem)+'<span class="eyebrow"> consumidas</span></div></div>'
    + '<div class="gauge">'+cols+'</div><div class="collab">'+labs+'</div></div>';
}

    res.forEach(function(it){

        + '<span class="mono" style="font-size:14px;font-weight:600;color:var(--verde);white-space:nowrap">'

          + fmt(tg.grasa)+' G · '+fmt(tg.hidratos)+' H</div></div>'
          + '<div class="ctrlp">'
          + '<button class="franja-btn' + (S.moverId === gr ? " on" : "") + '" data-act="mover" data-v="'+gr+'" '

               + 'title="Has cambiado la receta: guárdalo como plato nuevo">Guardar variante</button>' : '')

              return '<button class="chip'+(fx === f ? " on" : "")+'" data-act="moverGrupoA" '
                + 'data-v="'+gr+'" data-f="'+esc(fx)+'">'+esc(fx)+'</button>';

        if (S.guardarVar === gr) {
          h += '<div style="padding:9px 10px;border-bottom:1px solid var(--line);background:#fff">'

            + '<div style="display:flex;gap:8px;margin-top:9px">'
            + '<button class="btn" data-act="crearvar" data-v="'+gr+'">Guardar</button>'
            + '<button class="btn ghost" data-act="guardarvar" data-v="">Cancelar</button></div>';

          h += '</div>';
        }
        if (abierto) herm.forEach(function(x){
          const ix = BY[x[0]]; if (!ix) return;
          const f = x[6] || 1;
          h += '<div class="ingr"><div class="info">'
            + '<div style="font-size:14.5px">'+esc(x[0])+'</div>'

            + fmt(ix[3]*x[1]/BASE(ix)*f)+' P</div></div>'

      + (function(){

    if (!abierto) { h += '</div>'; }
    else {
    if (pd.nota) h += '<p class="note" style="margin:8px 0 0">'+esc(pd.nota)+'</p>';
    h += '<div style="margin-top:6px">';
    FRANJAS.forEach(function(fr){
      const dela = filas.filter(x => x.franja === fr);
      if (!dela.length) return;
      const subK = dela.reduce(function(a,x){ const t=BY[x.nombre]; return a + (t ? t[2]*x.cant/BASE(t) : 0); }, 0);
      const subP = dela.reduce(function(a,x){ const t=BY[x.nombre]; return a + (t ? t[3]*x.cant/BASE(t) : 0); }, 0);
      h += '<div class="grupo"><div class="gcab"><span class="gnom">'+esc(fr)+'</span>'
        + '<span class="gsub">'+fmt(subK)+' kcal · '+fmt(subP)+' g P</span></div><div class="gcue">';
      dela.forEach(function(x){
        const it = BY[x.nombre], ya = puesto(x.nombre, x.franja);
        if (!it) return;
        h += '<div class="logrow"><div class="info">'
          + '<div style="font-size:15px;'+(ya ? 'color:#5D6C65' : 'font-weight:600')+'">'+esc(x.nombre)+'</div>'

          + fmt(it[3]*x.cant/BASE(it))+' g P · '+fmtCant(x.cant)+' '+esc(UNI(it))+'</div></div>'
          + (ya ? '<span class="veredicto v-cabe">ya está</span>'
                : '<button class="btn tiny" data-act="addplan" data-v="'+esc(x.nombre)+'" data-f="'+esc(fr)+'" data-c="'+x.cant+'">Añadir</button>')
          + '</div>';
      });
      h += '</div></div>';
    });
    h += '</div></div>';
    }
  }

  h += vistaSemana();

  return h;
}

function vistaViabilidad() {
  const o = objetivos(S.params);
  const k = n => (BY[n] ? BY[n][2] : 0);
  const franjas = { "Comida":"comida", "Cena":"cena", "Desayuno":"desayuno", "Extras":"extras" };
  const min = {
    Desayuno: 180, Comida: 251, Cena: 310,
    postre1: k("Postre: yogur natural Danone con fruta"),
    postre2: k("Postre: skyr con fruta") || k("Postre: kéfir natural Mercadona con fruta"),
    cafe: k("Café solo o cortado"), cerveza: k("Cerveza (lata de 33 cl)"),
    batido: k("Batido de proteína con creatina")
  };
  const filas = VIAB.map(function(v){
    const nombre = v[0], franja = v[1];
    const it = BY[nombre];
    if (!it) return null;
    let suelo = min.cafe + min.postre1 + min.postre2 + min.cerveza + min.batido;
    if (franja === "Comida") suelo += min.Desayuno + min.Cena;
    else if (franja === "Cena") suelo += min.Desayuno + min.Comida;
    else suelo += min.Comida + min.Cena;
    const obj = esFinde(parseIso(S.fecha)) ? o.fin : o.lab;
    const margen = obj - suelo - it[2];
    return { plato: nombre, franja: franja, kcal: it[2], suelo: suelo, margen: margen,
             ver: margen >= 100 ? "Cabe" : (margen >= 0 ? "Justo" : "No cabe") };
  }).filter(Boolean);
  const orden = { "No cabe":0, "Justo":1, "Cabe":2 };
  filas.sort((a,b) => orden[a.ver]-orden[b.ver] || a.margen-b.margen);
  const cls = v => v==="Cabe"?"v-cabe":(v==="Justo"?"v-justo":"v-no");
  let h = '<div class="card"><span class="eyebrow">Mínimo inevitable del día</span>'
    + '<p class="note" style="margin:8px 0 0">Hay ingestas que no puedes eliminar: desayuno, café, los dos postres, '
    + 'la cerveza y la otra comida principal. Si el plato más ese mínimo pasan del objetivo, ese plato no cabe ese día. '
    + 'El mínimo usa la opción más barata de cada franja y la cerveza con alcohol; con una 0,0 ganas '
    + (k("Cerveza (lata de 33 cl)")-k("Cerveza 0,0 (lata de 33 cl)"))+' kcal de margen y con agua, '
    + k("Cerveza (lata de 33 cl)")+'.</p></div>';
  h += '<div class="card" style="overflow-x:auto"><table><thead><tr><th>Plato</th><th>Día</th><th>Entreno</th>'
    + '<th class="num">Mínimo del día</th><th class="num">Objetivo</th><th class="num">Margen</th><th>Veredicto</th></tr></thead><tbody>';
  filas.forEach(function(f){
    h += '<tr><td>'+esc(f.plato)+'</td><td>'+f.dia+'</td><td>'+f.ent+'</td>'
      + '<td class="num">'+fmt(f.min)+'</td><td class="num">'+fmt(f.obj)+'</td>'
      + '<td class="num" style="font-weight:700;color:'+(f.margen<0?"var(--rojo)":"var(--verde)")+'">'
      + (f.margen>=0?"+":"−")+fmt(Math.abs(f.margen))+'</td>'
      + '<td><span class="veredicto '+cls(f.ver)+'">'+f.ver+'</span></td></tr>';
  });
  h += '</tbody></table></div>'
    + '<div class="card"><p class="note" style="margin:0">«No cabe» no significa que no puedas comerlo: significa que '
    + 'ese día te saltarás el objetivo. Como el presupuesto es semanal, un día 150 kcal por encima se compensa con 30 '
    + 'menos en los cinco siguientes. Lo que no funciona es acumular varios.</p></div>';
  return h;
}

function seriePeso() {
  const claves = Object.keys(S.pesos).sort();
  if (claves.length === 0) return [];
  const ini = parseIso(claves[0]);
  const hoy = new Date();
  const fin = parseIso(claves[claves.length-1]) > hoy ? parseIso(claves[claves.length-1]) : hoy;
  const n = Math.max(0, Math.round((fin - ini)/86400000));
  const base = S.pesos[claves[0]];
  const ritmo = S.params.deficit*7/7700;
  const out = [];
  for (let i = 0; i <= n; i++) {
    const k = iso(addDays(ini, i));
    const v = [];
    for (let j = Math.max(0, i-6); j <= i; j++) {
      const p = S.pesos[iso(addDays(ini, j))]; if (p) v.push(p);
    }
    out.push({ k: k, peso: S.pesos[k] || null,
      media: v.length ? +(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2) : null,
      objetivo: +(base - ritmo*(i/7)).toFixed(2) });
  }
  return out;
}

function grafico(serie) {
  const W = 700, H = 200, PL = 40, PR = 8, PT = 10, PB = 22;
  const vals = [];
  serie.forEach(p => { if (p.peso) vals.push(p.peso); if (p.media) vals.push(p.media); vals.push(p.objetivo); });
  vals.push(S.params.pesoObjetivo);
  let lo = Math.min.apply(null, vals) - 0.4, hi = Math.max.apply(null, vals) + 0.4;
  if (hi - lo < 1.5) { const m = (hi+lo)/2; lo = m-0.75; hi = m+0.75; }
  const n = Math.max(1, serie.length-1);
  const X = i => PL + (i/n)*(W-PL-PR);
  const Y = v => PT + (1-(v-lo)/(hi-lo))*(H-PT-PB);
  const linea = (campo) => serie.map((p,i) => p[campo]==null?null:X(i).toFixed(1)+","+Y(p[campo]).toFixed(1))
    .filter(Boolean).join(" ");
  const puntos = serie.map((p,i) => p.peso==null?"":
    '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.peso).toFixed(1)+'" r="3" fill="var(--quince)"/>').join("");
  const yObj = Y(S.params.pesoObjetivo);
  const ticks = [lo+(hi-lo)*0.1, (lo+hi)/2, hi-(hi-lo)*0.1].map(v =>
    '<text x="'+(PL-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--ink)" font-weight="600" font-family="IBM Plex Mono">'
    + v.toFixed(1)+'</text><line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)
    + '" stroke="#B9C4BD" stroke-width="1"/>').join("");
  const et = i => { const d = parseIso(serie[i].k); return d.getDate()+"/"+(d.getMonth()+1); };
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="200" role="img" '
    + 'aria-label="Evolución del peso frente a la trayectoria prevista">'+ticks
    + (yObj > PT && yObj < H-PB ? '<line x1="'+PL+'" x2="'+(W-PR)+'" y1="'+yObj.toFixed(1)+'" y2="'+yObj.toFixed(1)
      + '" stroke="var(--verde)" stroke-width="2" stroke-dasharray="5 4"/>' : "")
    + '<polyline points="'+linea("objetivo")+'" fill="none" stroke="#5D6C65" stroke-width="2" stroke-dasharray="4 4"/>'
    + puntos
    + '<polyline points="'+linea("media")+'" fill="none" stroke="var(--verde)" stroke-width="3.2" stroke-linejoin="round"/>'
    + '<text x="'+PL+'" y="'+(H-6)+'" font-size="9" fill="var(--ink)" font-weight="600" font-family="IBM Plex Mono">'+et(0)+'</text>'
    + '<text x="'+(W-PR)+'" y="'+(H-6)+'" text-anchor="end" font-size="9" fill="var(--ink)" font-weight="600" font-family="IBM Plex Mono">'
    + et(serie.length-1)+'</text></svg>';
}

function vistaPeso() {
  const serie = seriePeso();
  const conM = serie.filter(p => p.media !== null);
  const ult = conM.length ? conM[conM.length-1].media : null;
  const prev = conM.length > 7 ? conM[conM.length-8].media : null;
  const varSem = (ult!=null && prev!=null) ? +(ult-prev).toFixed(2) : null;
  const ritmo = +(S.params.deficit*7/7700).toFixed(2);
  let lectura;
  if (varSem == null) lectura = "Necesitas al menos dos semanas de pesadas para que la variación semanal signifique algo.";
  else if (varSem < -0.7) lectura = "Bajas más rápido de lo previsto. Sube las calorías objetivo: a este ritmo parte de lo que pierdes es músculo.";
  else if (varSem > -0.15) lectura = "La media no baja al ritmo previsto. Antes de recortar comida, baja el factor de actividad en Ajustes: es más probable que el gasto esté sobreestimado.";
  else lectura = "Vas al ritmo previsto. No cambies nada.";
  const colVar = varSem==null ? "var(--ink)" : (varSem<-0.7 || varSem>-0.15) ? "var(--rojo)" : "var(--verde)";

  /* Llegada estimada usando el ritmo MEDIDO, no el teórico. Regresión sobre la media de 7 días. */
  const llegada = (function(){
    const reales = Object.keys(S.pesos).length;      // pesadas de verdad, no días rellenados
    if (reales < 14) return { falta: 14 - reales, reales: reales };
    const pts = conM.slice(-28);
    const t0 = parseIso(pts[0].k).getTime();
    let sx=0, sy=0, sxy=0, sxx=0;
    pts.forEach(function(p){
      const x = (parseIso(p.k).getTime() - t0) / 86400000, y = p.media;
      sx+=x; sy+=y; sxy+=x*y; sxx+=x*x;
    });
    const n = pts.length;
    const pend = (n*sxy - sx*sy) / (n*sxx - sx*sx);      // kg por día
    const ultima = pts[pts.length-1];
    const restan = ultima.media - S.params.pesoObjetivo;
    if (pend >= -0.0005) return { estancado:true, kgSem: pend*7 };
    const dias = Math.round(restan / -pend);
    const f = parseIso(ultima.k); f.setDate(f.getDate() + dias);
    return { fecha:f, dias:dias, kgSem: pend*7, semanas: Math.round(dias/7*10)/10 };
  })();

  let h = '<div class="card"><span class="eyebrow">Peso de hoy</span>'
    + '<div style="display:flex;gap:8px;margin-top:8px">'
    + '<input id="pesohoy" inputmode="decimal" enterkeyhint="done" placeholder="84,35" aria-label="Peso en kilos">'
    + '<button class="btn" data-act="peso">Anotar</button></div>'
    + '<p class="note" style="margin:9px 0 0">Pésate en ayunas, después del baño. El dato del día no significa nada '
    + 'por sí solo: oscila 1-2 kg por agua y sal. Lo que mide tu progreso es la media de 7 días.</p></div>';

  h += '<div class="card grid3"><div><span class="eyebrow">Media 7 días</span>'
    + '<div class="disp mono" style="font-size:29px;margin-top:5px">'+(ult!=null?ult.toFixed(2):"—")+'</div><div class="note">kg</div></div>'
    + '<div><span class="eyebrow">Variación semanal</span><div class="disp mono" style="font-size:29px;margin-top:5px;color:'+colVar+'">'
    + (varSem!=null?(varSem>0?"+":"")+varSem.toFixed(2):"—")+'</div><div class="note">objetivo −'+ritmo+'</div></div>'
    + '<div><span class="eyebrow">Falta</span><div class="disp mono" style="font-size:29px;margin-top:5px">'
    + (ult!=null?(ult-S.params.pesoObjetivo).toFixed(1):"—")+'</div><div class="note">kg hasta '+S.params.pesoObjetivo+'</div></div></div>';

  h += '<div class="card"><span class="eyebrow">Cuándo llegas a '+S.params.pesoObjetivo+' kg</span>';
  if (llegada.falta != null) {
    h += '<p class="note" style="margin:9px 0 0">Con '+llegada.reales
      + (llegada.reales===1?' pesada':' pesadas')+' todavía no puedo estimarlo: harían falta '+llegada.falta
      + ' más. Con menos de dos semanas, el ruido del agua y la sal pesa más que la tendencia.</p>';
  } else if (llegada.estancado) {
    h += '<div class="disp mono" style="font-size:26px;margin-top:6px;color:var(--rojo)">sin fecha</div>'
      + '<p class="note" style="margin:7px 0 0">Tu media de 7 días no baja ('
      + (llegada.kgSem>0?"+":"")+llegada.kgSem.toFixed(2)+' kg por semana). Revisa el registro antes de tocar el '
      + 'déficit: lo más frecuente es que falten cosas por anotar.</p>';
  } else {
    h += '<div class="disp" style="font-size:26px;margin-top:6px;color:var(--verde)">'
      + nfDia(llegada.fecha)+' de '+llegada.fecha.getFullYear()+'</div>'
      + '<p class="note mono" style="margin:6px 0 0;font-weight:600">quedan '+llegada.semanas
      + ' semanas · ritmo real '+llegada.kgSem.toFixed(2)+' kg por semana</p>'
      + '<p class="note" style="margin:8px 0 0">Calculado con la tendencia de tus pesadas, no con la teoría. '
      + 'Si metes días de más o te saltas el plan, esta fecha se mueve sola.</p>';
  }
  h += '</div>';

  if (serie.length > 1) {
    h += '<div class="card"><span class="eyebrow">Tendencia frente a la trayectoria prevista</span>'
      + '<div style="margin-top:10px">'+grafico(serie)+'</div>'
      + '<p class="note" style="margin-top:6px;font-weight:500">'
      + '<span style="color:var(--verde);font-weight:800">━</span> media 7 días · '
      + '<span style="color:var(--quince);font-weight:800">●</span> peso diario · '
      + '<span style="color:#5D6C65;font-weight:800">┈</span> previsto · '
      + '<span style="color:var(--verde);font-weight:800">┈</span> objetivo '+S.params.pesoObjetivo+' kg</p>'
      + '<p class="note">'+esc(lectura)+'</p></div>';
  }
  const n = Object.keys(S.pesos).length;
  h += '<div class="card"><span class="eyebrow">Historial · '+n+(n===1?" pesada":" pesadas")+'</span>'
    + '<p class="note" style="margin:8px 0 0">Los datos viven en este navegador. Si borras el historial de navegación '
    + 'o cambias de dispositivo, los pierdes: exporta una copia de vez en cuando desde Ajustes.</p></div>';
  return h;
}


/* Pasa un alimento del formato interno al de la pestaña «catalogo». */
function filaCat(i) {
  return [i[0], i[1], i[2], i[3], i[4], i[5], i[6], (i[7]||0)+(i[8]||0), i[9], i[10],
          ["Estimación","MyFitnessPal","Etiqueta","Tuyo"][i[11]] || "Estimación", i[12], i[13]];
}

/* Qué se lleva por delante borrar un alimento. */
function avisosBorrado(nom) {
  const av = [];
  const propia = recetaDe(nom);
  if (propia.length) av.push("Se borrará también su receta, de "+propia.length+" ingredientes.");
  const enRecetas = {};
  RECETAS.forEach(function (r) { if (r[1] === nom) enRecetas[r[0]] = 1; });
  const platos = Object.keys(enRecetas);
  if (platos.length) av.push("Es ingrediente de "+platos.length+(platos.length===1?" plato: ":" platos: ")
    + platos.slice(0,4).join(", ") + (platos.length>4 ? " y "+(platos.length-4)+" más" : "")
    + ". Esas recetas quedarán incompletas y sumarán menos de lo que deben.");
  let enPlan = 0;
  PLAN.forEach(function (d) { d.items.forEach(function (x) { if (x[0] === nom) enPlan++; }); });
  if (enPlan) av.push("Aparece "+enPlan+(enPlan===1?" vez":" veces")+" en el plan de 28 días. Esos días quedarán con un hueco.");
  let enReg = 0;
  Object.keys(S.ent).forEach(function (id) { if (!S.ent[id].borrado && S.ent[id].alimento === nom) enReg++; });
  if (enReg) av.push("Lo tienes en "+enReg+(enReg===1?" línea":" líneas")+" ya registradas, que dejarán de sumar.");
  if (!av.length) av.push("No lo usa nada: se puede borrar sin consecuencias.");
  return av;
}

/* Controles de una línea: cantidad, unidad, franja y la equis de quitar. */

function ctrlLinea(id, cant, uni, franja, etiqueta) {

  let h = '<div class="ctrl2">'
    + '<input class="cant-input" id="rc_'+id+'" data-rac="'+id+'" value="'+fmtCant(cant)+'" '

    + 'aria-expanded="'+(abierto?"true":"false")+'" '

    + '<button class="quitax" data-act="del" data-id="'+id+'" title="Quitar" '
    + 'aria-label="Quitar '+etiqueta+'">✕</button></div>';

/* ---------- copiar a otra fecha y guardar variantes ---------- */
function grupoModificado(lineas, plato) {
  const r = recetaDe(plato);
  if (!r.length) return false;
  if (lineas.length !== r.length) return true;
  return r.some(function (x) {
    const l = lineas.filter(y => y[0] === x[1])[0];
    return !l || Math.abs(l[1] - x[2]) > 0.5;
  });
}
function nombreVariante(plato) {
  let n = plato + " (variante)";
  let k = 2;
  while (BY[n]) { n = plato + " (variante " + k + ")"; k++; }
  return n;
}
function copiarFranjaA(fr, destino) {
  const reg = logDe(S.fecha).filter(e => e[2] === fr);
  const mapa = {};
  reg.forEach(function (e) {
    let g = "";
    if (e[5]) {
      if (!mapa[e[5]]) {
        mapa[e[5]] = "g" + uid();
        S.grupos = S.grupos || {};
        S.grupos[mapa[e[5]]] = S.grupos[e[5]] || "Plato";
      }
      g = mapa[e[5]];
    }
    anotar(destino, e[0], e[1], fr, g, e[6] || 1);
  });
  guardar();
  return reg.length;
}

/* ---------- repetir un día y guardar una franja como plato ---------- */
function diasConFranja(fr, limite) {
  const por = {};
  Object.keys(S.ent).forEach(function (id) {
    const e = S.ent[id];
    if (e.borrado || e.franja !== fr || e.fecha === S.fecha) return;
    (por[e.fecha] = por[e.fecha] || []).push(e);
  });
  return Object.keys(por).sort().reverse().slice(0, limite || 10).map(function (f) {
    const l = por[f];
    return { fecha:f, n:l.length, kcal: totales(l.map(e => [e.alimento, e.cant, e.franja, e.id, e.ts, e.grupo, e.factor])).kcal,
             nombres: l.map(e => (e.grupo && S.grupos && S.grupos[e.grupo]) || e.alimento)
                       .filter(function (x, i, a) { return a.indexOf(x) === i; }) };
  });
}

function copiarFranja(fr, desde) {
  const mapa = {};
  Object.keys(S.ent).forEach(function (id) {
    const e = S.ent[id];
    if (e.borrado || e.franja !== fr || e.fecha !== desde) return;
    let g = "";
    if (e.grupo) {
      if (!mapa[e.grupo]) {
        mapa[e.grupo] = "g" + uid();
        S.grupos = S.grupos || {};
        S.grupos[mapa[e.grupo]] = S.grupos[e.grupo] || "Plato";
      }
      g = mapa[e.grupo];
    }
    anotar(S.fecha, e.alimento, e.cant, fr, g, e.factor || 1);
  });
  guardar();
}

/* Convierte un grupo (un plato con su receta tocada) en un plato nuevo. */
function grupoComoPlato(gr, nombre) {
  const nom = String(nombre || "").trim();
  if (!nom) return "Ponle un nombre.";
  if (BY[nom]) return "Ya existe un alimento con ese nombre.";
  const reg = logDe(S.fecha).filter(e => e[5] === gr);
  if (!reg.length) return "Ese plato ya no está.";
  return crearPlatoDesde(nom, reg, "Variante guardada el "+nfDia(parseIso(S.fecha)));
}

function crearPlatoDesde(nom, reg, descripcion) {
  const t = totales(reg);
  ITEMS = ITEMS.concat([[nom, "Mis platos", Math.round(t.kcal), Math.round(t.prot*10)/10,
    Math.round(t.grasa*10)/10, Math.round(t.hidratos*10)/10, Math.round(t.alc*10)/10,
    Math.round(t.verdura + t.fruta), 0, "N.A.", descripcion, 3, 1, "raciones", "propio"]]);
  const junta = {};
  reg.forEach(function (e) {
    const k = e[0] + "|" + (e[6] || 1);
    if (!junta[k]) junta[k] = { ing:e[0], cant:0, f:e[6] || 1 };
    junta[k].cant += e[1];
  });
  const filasR = Object.keys(junta).map(k => [nom, junta[k].ing, Math.round(junta[k].cant*10)/10, junta[k].f]);
  RECETAS = RECETAS.filter(r => r[0] !== nom).concat(filasR);
  reindex();
  guardarPlatos([filaCat(ITEMS[ITEMS.length-1])], [], filasR);
  return null;
}

/* Convierte lo que hay ahora en una franja en un plato nuevo del catálogo, con su receta. */
function franjaComoPlato(fr, nombre) {
  const nom = String(nombre || "").trim();
  if (!nom) return "Ponle un nombre.";
  if (BY[nom]) return "Ya existe un alimento con ese nombre.";
  const reg = logDe(S.fecha).filter(e => e[2] === fr);
  if (!reg.length) return "No hay nada en esa franja.";
  return crearPlatoDesde(nom, reg, "Guardado desde el registro del "+nfDia(parseIso(S.fecha)));
}

/* ---------- la semana: qué toca y qué comprar ---------- */
function lunesDe(d) {
  const f = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const dw = (f.getDay() + 6) % 7;          // 0 = lunes
  f.setDate(f.getDate() - dw);
  return f;
}

function vistaSemana() {
  const abierta = !!S.params.semanaAbierta;
  const o = objetivos(S.params);
  const lun = lunesDe(parseIso(S.fecha));
  const dom = addDays(lun, 6);
  let h = '<div class="card" id="sec-semana"><div class="row" style="align-items:flex-start">'
    + '<div><span class="eyebrow">La semana</span>'
    + '<div style="font-size:15px;margin-top:5px;font-weight:500">Del '+nfDia(lun)+' al '+nfDia(dom)+'</div></div>'
    + '<button class="chev" data-act="plegarsemana" aria-expanded="'+(abierta?"true":"false")+'" '
    + 'aria-label="'+(abierta?"Ocultar":"Ver")+' la semana">'+(abierta?"▾":"▸")+'</button></div>';
  if (!abierta) { h += '</div>'; return h; }

  /* --- resumen numérico: qué llevas cada día y cómo va el cómputo semanal --- */
  let acumKcal = 0, acumProt = 0, acumObj = 0;
  let filas = "";
  for (let i = 0; i < 7; i++) {
    const dd = addDays(lun, i), k = iso(dd);
    const reg = logDe(k);
    const tt = totales(reg);
    const objD = esFinde(dd) ? o.fin : o.lab;
    const hayDatos = reg.length > 0;
    acumKcal += tt.kcal; acumProt += tt.prot; acumObj += objD;
    const desv = tt.kcal - objD;
    filas += '<tr'+(k === S.fecha ? ' class="hoy"' : '')+'>'
      + '<td><button class="lnk" data-act="ir" data-f="'+k+'">'+DIAS[i].slice(0,3)+' '+dd.getDate()+'</button></td>'
      + '<td class="num mono">'+(hayDatos ? fmt(tt.kcal) : "—")+'</td>'
      + '<td class="num mono obj">'+fmt(objD)+'</td>'
      + '<td class="num mono '+(hayDatos ? (desv > 0 ? "rojo" : "verde") : "")+'">'
      + (hayDatos ? (desv > 0 ? "+" : "") + fmt(desv) : "—")+'</td>'
      + '<td class="num mono '+(hayDatos ? (tt.prot >= o.prot ? "verde" : "rojo") : "")+'">'
      + (hayDatos ? fmt(tt.prot) : "—")+'</td></tr>';
  }
  const balance = acumKcal - acumObj;
  h += '<div style="overflow-x:auto;margin-top:10px"><table class="tsem"><thead><tr>'
    + '<th>Día</th><th class="num">kcal</th><th class="num">obj.</th><th class="num">desvío</th>'
    + '<th class="num">prot.</th></tr></thead><tbody>'+filas+'</tbody>'
    + '<tfoot><tr><td>Semana</td><td class="num mono">'+fmt(acumKcal)+'</td>'
    + '<td class="num mono obj">'+fmt(o.semanal)+'</td>'
    + '<td class="num mono '+(acumKcal > o.semanal ? "rojo" : "verde")+'">'
    + (acumKcal > o.semanal ? "+" : "")+fmt(acumKcal - o.semanal)+'</td>'
    + '<td class="num mono">'+fmt(acumProt)+'</td></tr></tfoot></table></div>';
  h += '<p class="note" style="margin:8px 0 0">El desvío de cada día no importa por sí solo: lo que cuenta es '
    + 'la fila de abajo. '+(balance > 0
        ? 'Vas <b>'+fmt(balance)+' kcal por encima</b> de lo que tocaría a estas alturas.'
        : 'Te sobran <b>'+fmt(Math.abs(balance))+' kcal</b> respecto a lo que tocaría.')+'</p>';

  /* --- los siete días con sus platos --- */
  const compra = {};
  for (let i = 0; i < 7; i++) {
    const dd = addDays(lun, i);
    const idx = planIndex(dd);
    const pd = idx == null ? null : PLAN[idx];
    const esHoy = iso(dd) === S.fecha;
    h += '<div class="grupo" style="margin-top:'+(i?10:14)+'px'+(esHoy?';border-width:2.5px':'')+'">'
      + '<div class="gcab"><span class="gnom">'+nfDia(dd)+(esHoy?' · hoy':'')+'</span>'
      + '<span class="gsub">'+esc(iso(dd).split("-").reverse().join("-"))+'</span></div><div class="gcue">';
    if (!pd) h += '<p class="note" style="padding:8px 0">Sin plan para ese día.</p>';
    else {
      const porFranja = {};
      pd.items.forEach(function (x) {
        (porFranja[x[1]] = porFranja[x[1]] || []).push(x[0]);
        const it = BY[x[0]];
        const cant = x.length > 2 ? x[2] : (it ? BASE(it) : 1);
        if (!compra[x[0]]) compra[x[0]] = { veces:0, total:0, uni: it ? UNI(it) : "", dias:[] };
        compra[x[0]].veces++; compra[x[0]].total += cant;
        compra[x[0]].dias.push(DIAS[(dd.getDay()+6)%7].slice(0,3));
      });
      FRANJAS.forEach(function (fr) {
        const l = porFranja[fr]; if (!l) return;
        h += '<div class="filaf"><span class="note ff">'+esc(fr)+'</span>'
          + '<span class="fp">'+l.map(esc).join(" · ")+'</span></div>';
      });
    }
    h += '</div></div>';
  }

  /* --- la compra --- */
  const ord = S.ordSem || { col:"veces", dir:-1 };
  const lista = Object.keys(compra).map(function (n) {
    return { plato:n, veces:compra[n].veces, total:compra[n].total,
             uni:compra[n].uni, dias:compra[n].dias.join(" ") };
  });
  lista.sort(function (a, b) {
    const x = a[ord.col], y = b[ord.col];
    if (typeof x === "string") return ord.dir * x.localeCompare(y, "es");
    return ord.dir * (x - y);
  });
  const flecha = c => ord.col === c ? (ord.dir < 0 ? " ↓" : " ↑") : "";
  h += '<div style="margin-top:16px"><span class="eyebrow">Qué necesitas esta semana</span>'
    + '<p class="note" style="margin:6px 0 8px">Pulsa en una cabecera para ordenar.</p>'
    + '<div style="overflow-x:auto"><table><thead><tr>'
    + '<th><button class="ordth" data-act="ordsem" data-v="plato">Alimento'+flecha("plato")+'</button></th>'
    + '<th class="num"><button class="ordth" data-act="ordsem" data-v="veces">Veces'+flecha("veces")+'</button></th>'
    + '<th class="num"><button class="ordth" data-act="ordsem" data-v="total">Total'+flecha("total")+'</button></th>'
    + '<th>Días</th></tr></thead><tbody>';
  lista.forEach(function (f) {
    h += '<tr><td>'+esc(f.plato)+'</td><td class="num">'+f.veces+'</td>'
      + '<td class="num">'+fmtCant(Math.round(f.total*100)/100)+' '+esc(f.uni)+'</td>'
      + '<td class="note">'+esc(f.dias)+'</td></tr>';
  });
  h += '</tbody></table></div></div></div>';
  return h;
}


/* ================== ACCESO A DATOS ==================
   La hoja de Google es la ÚNICA base de datos. Aquí no se guarda ningún registro:
   se piden al abrir y cada cambio se escribe allí antes de pintarlo.
   El servidor atiende una petición cada vez, así que dos dispositivos nunca
   escriben a la vez: uno espera al otro. ==================================== */

let ocupado = 0;
const esperaCant = {};
let esperaParams = null;
let colaError = "";

/* Actualiza solo la barra de macros. Repintar todo mientras escribes te robaría el cursor. */
function pintarPanel() {
  const n = document.getElementById("restante");
  if (!n || !n.parentNode) return;
  const o = objetivos(S.params);
  const d = parseIso(S.fecha);
  const objD = esFinde(d) ? o.fin : o.lab;
  const t = totales(logDe(S.fecha));
  const tmp = document.createElement("div");
  tmp.innerHTML = panelRestante(t, objD, o);
  if (tmp.firstChild) n.parentNode.replaceChild(tmp.firstChild, n);
}

function trabajando(on, texto) {
  ocupado = Math.max(0, ocupado + (on ? 1 : -1));
  const cap = document.getElementById("cargando");
  if (!cap) return;
  cap.className = ocupado ? "cargando on" : "cargando";
  if (on && texto) cap.querySelector(".ctxt").textContent = texto;
}

async function pedir(cuerpo, texto) {
  if (!S.sync.url || !S.sync.token) {
    colaError = "Falta la dirección del script o el token. Ve a Ajustes.";
    render();
    return null;
  }
  trabajando(true, texto || "Guardando…");
  try {
    const res = await fetch(S.sync.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ token: S.sync.token, fecha: S.fecha, catVer: S.catVer || "" }, cuerpo))
    });
    const d = await res.json();
    if (d.error) {
      colaError = d.mensaje || "No se ha podido guardar.";
      if (d.error === "ocupado") colaError = "El otro dispositivo estaba guardando. Vuelve a intentarlo.";
      return null;
    }
    aplicar(d);
    if (!d.backend) {
      colaError = "El script de Google que tienes desplegado es antiguo y no guarda nada. "
        + "En Apps Script: Implementar → Gestionar implementaciones → lápiz → Versión nueva → Implementar.";
      return null;
    }
    if (d.backend !== VERSION) {
      colaError = "La app es la "+VERSION+" y el script desplegado es la "+d.backend
        + ". Vuelve a desplegar el script (Versión nueva) o sube el index.html que le corresponda.";
      return null;
    }
    colaError = "";
    return d;
  } catch (err) {
    colaError = "Sin conexión con la hoja. Comprueba la red y vuelve a intentarlo.";
    return null;
  } finally {
    trabajando(false);
    render();
  }
}

/* Vuelca en memoria lo que ha devuelto la hoja. Nada de esto se guarda en el navegador
   salvo el catálogo, que es material de consulta y no datos tuyos. */
function aplicar(d) {
  // se sustituye de golpe, ya con los datos en la mano: la pantalla no se queda en blanco
  const nuevo = {};
  (d.entradas || []).forEach(function (e) { nuevo[e.id] = e; });
  S.ent = nuevo;
  S.semana = d.semana || null;
  S.pesos = d.pesos || {};
  Store.set("carlos:vista", S.ent);
  Store.set("carlos:vistasem", S.semana);
  if (d.params) S.params = Object.assign({}, DEFAULTS, d.params);
  if (d.catalogo && d.catalogo.length) {
    ITEMS = d.catalogo.map(function (f) {
      const ori = { "Estimación":0, "MyFitnessPal":1, "Etiqueta":2, "Tuyo":3 }[String(f[10])] || 0;
      return [f[0], f[1], f[2], f[3], f[4], f[5], f[6], f[7], 0, f[8], f[9], ori, f[11], f[12],
              ori === 3 ? "propio" : ""];
    });
    reindex();
    Store.set("carlos:cat", ITEMS);
  }
  if (d.recetas) { RECETAS = d.recetas; Store.set("carlos:recetas", RECETAS); }
  if (d.plan && d.plan.length) {
    const porDia = {};
    d.plan.forEach(function (f) {
      const k = f[0];
      if (!porDia[k]) porDia[k] = { sem:f[1], dia:f[2], tipo:f[3], nota:f[4], items:[] };
      porDia[k].items.push([f[6], f[5], f[7]]);
    });
    const dias = Object.keys(porDia).map(Number).sort((a,b) => a-b).map(k => porDia[k]);
    if (dias.length) { PLAN = dias; Store.set("carlos:plan", PLAN); }
  }
  if (d.catVer) { S.catVer = d.catVer; Store.set("carlos:catver", d.catVer); }
}

/* La semana cargada cubre la fecha que se está viendo. Si te vas a otra, se pide. */
function necesitaCargar(f) {
  return !S.semana || f < S.semana.desde || f > S.semana.hasta;
}

async function cargar(texto) {
  return pedir({ accion: "cargar" }, texto || "Cargando…");
}

async function irA(fecha) {
  S.fecha = fecha;
  render();                                  // se pinta ya con lo que haya
  if (necesitaCargar(fecha)) await cargar("Cargando la semana…");
}

async function anotar(fecha, alimento, cant, franja, grupo, factor) {
  const it = { id: uid(), fecha: fecha, franja: franja, alimento: alimento,
               cant: cant, grupo: grupo || "", factor: factor || 1 };
  return pedir({ accion: "anotar", items: [it] }, "Añadiendo…");
}

async function anotarVarios(items) {
  if (!items.length) {
    if (!S.aviso) S.aviso = "No había nada que añadir.";
    render();
    return null;
  }
  return pedir({ accion: "anotar", items: items.map(function (x) {
    return { id: uid(), fecha: x.fecha, franja: x.franja, alimento: x.alimento,
             cant: x.cant, grupo: x.grupo || "", factor: x.factor || 1 };
  }) }, "Añadiendo…");
}

/* Un plato con receta entra como sus ingredientes, agrupados. */
function itemsDePlato(fecha, plato, cant, franja) {
  const r = recetaDe(plato);
  if (!r.length) return [{ fecha:fecha, franja:franja, alimento:plato, cant:cant }];

  const faltan = r.filter(x => !BY[x[1]]).map(x => x[1]);
  const hay = r.filter(x => BY[x[1]]);

  // si la receta se ha quedado sin ingredientes, se registra el plato entero y se avisa
  if (!hay.length) {
    S.aviso = "«"+plato+"» tiene receta, pero ninguno de sus ingredientes está ya en el catálogo ("
      + faltan.slice(0,4).join(", ") + (faltan.length>4 ? " y "+(faltan.length-4)+" más" : "")
      + "). Lo he registrado entero, sin desglosar.";
    return [{ fecha:fecha, franja:franja, alimento:plato, cant:cant }];
  }
  if (faltan.length) {
    S.aviso = "Ojo: a «"+plato+"» le faltan ingredientes en el catálogo ("+faltan.join(", ")
      + "), así que suma menos de lo que debería. Créalos en Alimentos y volverá a cuadrar.";
  }

  const it = BY[plato];
  const prop = it ? cant / BASE(it) : 1;
  const g = "g" + uid();
  S.grupos = S.grupos || {};
  S.grupos[g] = plato;
  Store.set("carlos:grupos", S.grupos);
  return hay.map(function (x) {
    return { fecha:fecha, franja:franja, alimento:x[1],
             cant: Math.round(x[2] * prop * 10) / 10, grupo:g, factor:x[3] };
  });
}

async function anotarPlato(fecha, plato, cant, franja) {
  return anotarVarios(itemsDePlato(fecha, plato, cant, franja));
}

async function tocar(id, cambios) {
  const e = S.ent[id];
  if (e) Object.assign(e, cambios);       // se pinta ya, y se confirma al volver de la hoja
  render();
  return pedir({ accion: "editar", id: id, cambios: cambios }, "Guardando…");
}

async function borrarEntrada(id) {
  return borrarVarias([id]);
}

async function borrarVarias(ids) {
  ids.forEach(function (id) { delete S.ent[id]; });
  render();
  return pedir({ accion: "borrar", ids: ids }, "Quitando…");
}

async function ponerPeso(fecha, peso) {
  S.pesos[fecha] = peso;
  return pedir({ accion: "peso", fecha: fecha, peso: peso }, "Guardando el peso…");
}

async function guardarParams() {
  return pedir({ accion: "params", params: S.params }, "Guardando los ajustes…");
}

async function guardarPlatos(platos, bajas, recetas) {
  return pedir({ accion: "platos", platos: platos || [], borrarPlatos: bajas || [],
                 recetas: recetas || [] }, "Guardando el alimento…");
}

/* ---------- motor de sugerencias ---------- */
const COMPAT = {
  "Desayuno":            ["Desayuno","Post-entreno 6:30","Alimentos sueltos","Suplemento","Hamaiketako"],
  "Hamaiketako":         ["Hamaiketako","Alimentos sueltos","Postre","Suplemento"],
  "Comida":              ["Comida","Alimentos sueltos"],
  "Merienda":            ["Aperitivo / Merienda","Alimentos sueltos","Postre","Hamaiketako"],
  "Cena":                ["Cena","Comida","Alimentos sueltos","Postre","Bebida"],
  "Extras":              ["Extras","Bebida","Alimentos sueltos","Postre","Suplemento"]
};

function sugerencias(franja, reg, objD, o) {
  const t = totales(reg);
  const restoKcal = objD - t.kcal;
  const faltaProt = Math.max(0, o.prot - t.prot);
  const faltaVF   = Math.max(0, S.params.objVF - (t.verdura + t.fruta));
  const usadas = {}; reg.forEach(e => usadas[e[0]] = true);
  const vacias = FRANJAS.filter(f => !reg.some(e => e[2] === f));
  const ultima = vacias.length <= 1;
  const dw = parseIso(S.fecha).getDay();          // 1..4 = lunes a jueves
  const esTaperDia = dw >= 1 && dw <= 4;
  const cats = COMPAT[franja] || [];
  const k2 = it => it[2];
  const esc2 = Math.max(200, Math.abs(restoKcal));

  const cand = catalogo().filter(function(it){
    if (usadas[it[0]]) return false;
    if (it[2] <= 0) return false;
    if (it[1] === "Mis alimentos") return true;
    if (cats.indexOf(it[1]) < 0) return false;
    if (franja === "Comida" && esTaperDia && it[9] === "No") return false;
    if (it[9] === "Excepción") return false;                 // KFC, menú del día, hamburguesa de restaurante
    if (it[0].indexOf("Fuera (") === 0) return false;
    if (restoKcal < 150 && k2(it) > Math.max(140, restoKcal + 70)) return false;
    return true;
  }).map(function(it){
    const k = it[2], p = it[3], vf = it[7] + it[8];
    const sobra = Math.max(0, k - restoKcal);
    const corto = Math.max(0, restoKcal - k);
    let s = 0;
    s += 100 * Math.min(1, p / Math.max(1, faltaProt));
    s +=  30 * Math.min(1, vf / Math.max(1, faltaVF));
    s -=  70 * (sobra / esc2);
    s -=  (ultima ? 45 : 12) * (corto / esc2);
    let ver = "cuadra";
    if (sobra > 60) ver = "se pasa "+fmt(sobra);
    else if (ultima && corto > 300) ver = "deja "+fmt(corto)+" sin usar";
    return { it:it, kcal:k, prot:p, vf:vf, score:s, ver:ver, restaDespues: restoKcal - k };
  });
  cand.sort((a, b) => b.score - a.score);
  return { lista: cand.slice(0, 6), restoKcal:restoKcal, faltaProt:faltaProt, faltaVF:faltaVF,
           vacias:vacias, ultima:ultima };
}

function vistaSugerencias(reg, objD, o) {
  const t = totales(reg);
  const resto = objD - t.kcal;
  const faltaProt = Math.max(0, o.prot - t.prot);
  const vacias = FRANJAS.filter(f => !reg.some(e => e[2] === f));
  let h = '<div class="card"><div class="row"><div><span class="eyebrow">Sugerencias para cuadrar el día</span>'
    + '<div class="note" style="margin-top:5px">Te quedan <b>'+fmt(Math.max(0,resto))+' kcal</b>'
    + (faltaProt > 0 ? ' y te faltan <b>'+fmt(faltaProt)+' g de proteína</b>' : ' y la proteína ya está cubierta')
    + (vacias.length ? '. Franjas sin nada: '+vacias.join(", ").toLowerCase()+'.' : '.')+'</div></div></div>';
  h += '<div style="display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px">';
  FRANJAS.forEach(function(f){
    const vacia = vacias.indexOf(f) >= 0;
    h += '<button class="btn tiny'+(S.sug === f ? "" : " ghost")+'" data-act="sug" data-v="'+esc(f)+'">'
      + esc(f)+(vacia ? "" : " ✓")+'</button>';
  });
  h += '<button class="btn'+(S.sug === "__prot__" ? "" : " ghost")+' tiny" data-act="sug" data-v="__prot__">'
    + 'Solo proteína</button>'
    + '<button class="btn ghost tiny" data-act="sug" data-v="">Cerrar</button></div>';

  if (!S.sug) {
    h += '<p class="note" style="margin:6px 0 0">Elige la franja que quieres decidir. El ✓ marca las que ya tienes '
      + 'con algo.</p></div>';
    return h;
  }
  if (S.sug === "__prot__") {
    const falta = Math.max(0, o.prot - t.prot);
    if (falta <= 0) {
      h += '<p class="note" style="margin:9px 0 0;font-weight:600;color:var(--verde)">La proteína del día ya está '
        + 'cubierta: '+fmt(t.prot)+' de '+fmt(o.prot)+' g.</p></div>';
      return h;
    }
    const cabe = Math.max(0, resto);
    const cand = catalogo().filter(function (it) {
      if (it[2] < 30 || it[3] <= 0) return false;
      if (it[9] === "Excepción" || it[0].indexOf("Fuera (") === 0) return false;
      return it[2] <= cabe + 80;
    }).map(function (it) {
      return { it:it, dens: it[3] / it[2] * 100,
               veces: Math.max(1, Math.min(4, Math.round(falta / it[3] * 2) / 2)) };
    });
    cand.sort((a, b) => b.dens - a.dens);
    h += '<p class="note" style="margin:8px 0 10px">Te faltan <b>'+fmt(falta)+' g de proteína</b> y te caben '
      + '<b>'+fmt(cabe)+' kcal</b>. Esto es lo que más proteína te da por caloría, de lo que cabe hoy.</p>';
    if (!cand.length) h += '<p class="note">Con las calorías que quedan no entra nada con proteína suficiente.</p>';
    cand.slice(0, 8).forEach(function (c) {
      const it = c.it;
      const n = Math.max(1, Math.ceil(falta / it[3] * 10) / 10);
      const cant = Math.round(BASE(it) * Math.min(n, 3) * 10) / 10;
      const kc = it[2] * cant / BASE(it), pr = it[3] * cant / BASE(it);
      h += '<div class="platoc"><div class="ingr"><div class="info">'
        + '<div style="font-size:15px;font-weight:600">'+esc(it[0])+'</div>'
        + '<div class="note mono" style="font-weight:600">'+fmt(it[3])+' g P por '+fmt(it[2])+' kcal · '
        + '<b>'+c.dens.toFixed(1)+' g por 100 kcal</b></div>'
        + '<div class="note">'+fmtCant(cant)+' '+esc(UNI(it))+' te darían '+fmt(pr)+' g de proteína en '
        + fmt(kc)+' kcal'+(kc > cabe ? ' (te pasarías '+fmt(kc-cabe)+')' : '')+'</div></div>'
        + '<button class="btn tiny" data-act="addprot" data-v="'+esc(it[0])+'" data-c="'+cant+'">Añadir</button>'
        + '</div></div>';
    });
    h += '<p class="note" style="margin-top:10px">Se añade a <b>'+esc(S.franja).toLowerCase()+'</b>. '
      + 'Cambia la franja arriba si quieres otra.</p></div>';
    return h;
  }

  const r = sugerencias(S.sug, reg, objD, o);
  if (resto <= 0) {
    h += '<p class="aviso" style="margin:8px 0 0">Hoy ya te has pasado '+fmt(-resto)+' kcal del objetivo del día, '
      + 'así que no te voy a proponer nada más. Mira el número de la semana: si sigue en verde, no hay problema; '
      + 'si está en rojo, recorta 50-100 kcal en los días que queden.</p></div>';
    return h;
  }
  if (resto < 250 && r.ultima) {
    h += '<p class="aviso" style="margin:8px 0">Con '+fmt(Math.max(0,resto))+' kcal no cabe una '
      + S.sug.toLowerCase()+' de verdad. Dos salidas: saltártela (ayuno) y aceptar que hoy te quedas corto de '
      + 'proteína, o pasarte 200-300 kcal y compensarlo en los días que quedan de semana. Con el presupuesto '
      + 'semanal, lo segundo suele ser mejor idea.</p>';
  }
  if (!r.lista.length) {
    h += '<p class="note" style="margin:8px 0 0">No tengo nada que encaje en esa franja. Añádelo a mano o créalo '
      + 'en Alimentos.</p></div>';
    return h;
  }
  const clase = v => v === "cuadra" ? "v-cabe" : (v.indexOf("se pasa") === 0 ? "v-no" : "v-justo");
  r.lista.forEach(function(c){
    const it = c.it;
    h += '<div class="logrow"><div style="flex:1;min-width:170px">'
      + '<div style="font-size:15px;font-weight:600">'+esc(it[0])+' <span class="veredicto '+clase(c.ver)+'">'
      + esc(c.ver)+'</span></div>'
      + '<div class="note mono" style="font-weight:600">'+fmt(c.kcal)+' kcal · '+fmt(c.prot)+' g P · '
      + fmt(c.vf)+' g verdura y fruta</div>'
      + '<div class="note">te dejaría en '+fmt(t.kcal + c.kcal)+' / '+fmt(objD)+' kcal y '
      + fmt(t.prot + c.prot)+' / '+fmt(o.prot)+' g de proteína</div></div>'
      + '<button class="btn tiny" data-act="addsug" data-v="'+esc(it[0])+'" data-f="'+esc(S.sug)+'">Añadir</button>'
      + '</div>';
  });
  h += '<p class="note" style="margin-top:10px">Ordenadas por lo que aportan de la proteína que te falta, luego por '
    + 'verdura, penalizando lo que se pasa de calorías. En la comida de lunes a jueves solo aparecen platos aptos '
    + 'para taper.</p></div>';
  return h;
}

const CAMPOS_ED = [["kcal","Calorías","kcal",""],["prot","Proteína","g",""],["grasa","Grasa","g",""],

function abrirEd(nombre) {
  const it = BY[nombre];
  S.ed = it ? { nombre:it[0], nombreOrig:it[0], cat:it[1], kcal:it[2], prot:it[3], grasa:it[4],
                hidratos:it[5], alc:it[6], verdura:it[7], fruta:it[8], racion:it[10],
                base:it[12], baseOrig:it[12], unidad:it[13], unidadOrig:it[13],
                propio:it[14] === "propio" }
              : { nombre:"", nombreOrig:"", cat:"Alimentos sueltos", kcal:"", prot:"", grasa:"",
                  hidratos:"", alc:"", verdura:"", fruta:"", racion:"", base:1, baseOrig:1,
                  unidad:"raciones", unidadOrig:"raciones", propio:true };
}

function guardarEd() {
  const e = S.ed, nom = String(e.nombre || "").trim();
  const num = v => { const x = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isNaN(x) ? 0 : x; };
  if (!nom) return "Ponle un nombre.";
  if (nom !== e.nombreOrig && BY[nom]) return "Ya existe otro alimento con ese nombre.";
  const bs = cantidad(e.base) || 1;
  const vfTotal = e.vf != null ? num(e.vf) : (num(e.verdura) + num(e.fruta));
  const it = [nom, e.cat || "Mis alimentos", num(e.kcal), num(e.prot), num(e.grasa), num(e.hidratos),
              num(e.alc), vfTotal, 0, "N.A.",
              String(e.racion || "").trim() || (fmtCant(bs) + " " + (e.unidad || "raciones")),
              0, bs, e.unidad || "raciones", "propio"];
  ITEMS = ITEMS.filter(x => x[0] !== e.nombreOrig && x[0] !== nom).concat([it]);
  reindex();
  const bajas = (e.nombreOrig && nom !== e.nombreOrig) ? [e.nombreOrig] : [];
  guardarPlatos([filaCat(it)], bajas, []);
  if (e.nombreOrig && nom !== e.nombreOrig) {
    Object.keys(S.ent).forEach(function(id){
      if (S.ent[id].alimento === e.nombreOrig) tocar(id, { alimento: nom });
    });
  }
  reindex(); guardar();
  return null;
}

      }

  }

  // alimentos a los que apunta el registro y que ya no existen

    });

  }

  if (S.recien && S.recien.length) {
    h += '<div class="card"><div class="row"><span class="eyebrow">Recién creados · '+S.recien.length+'</span>'
      + '<button class="btn ghost tiny" data-act="cerrarrecien">Cerrar</button></div>'
      + '<p class="note" style="margin:8px 0 10px">Ya están en tu catálogo. Si quieres, añádelos al día que tienes '
      + 'abierto en Registro ('+nfDia(parseIso(S.fecha))+'). Si no, cierra y ya está.</p>'
      + '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px">';
    FRANJAS.forEach(function (fx) {
      h += '<button class="btn tiny'+(S.franjaRecien === fx ? "" : " ghost")+'" data-act="franjarecien" '

        + '<div style="font-size:15px;font-weight:600">'+esc(n)+'</div>'

    if (S.recien.length > 1)
      h += '<div style="margin-top:10px"><button class="btn" data-act="addrecien" data-v="__todos__">'
        + 'Añadir los '+S.recien.length+' a '+esc(S.franjaRecien || S.franja).toLowerCase()+'</button></div>';
    h += '</div>';
  }

  h += '<div class="card"><span class="eyebrow">Añadir desde la etiqueta de un producto</span>'
    + '<p class="note" style="margin:8px 0 8px">La app no puede leer fotos por sí sola: es un archivo HTML sin '
    + 'servidor ni conexión a ningún servicio. El camino que sí funciona: haz la foto de la tabla nutricional, '
    + 'mándamela en el chat y te devuelvo una línea de datos. Pégala aquí y el alimento queda creado.</p>'
    + '<p class="note" style="margin:0 0 8px">Un alimento suelto lleva sus datos. Un plato lleva además '
    + '<b>receta</b>, y entonces sus calorías se reparten entre los ingredientes; si le pones <b>kcal</b>, '
    + 'se escala para que cuadren con ese dato. Con <b>raciones</b> divides una olla entre varios.<br>'
    + '<code style="font-family:\'IBM Plex Mono\',monospace;font-size:12.5px;background:#DCE7E0;padding:2px 5px">'
    + '[{"nombre":"Yogur Aldi maracuyá","base":150,"unidad":"g","kcal":98,"prot":15,"grasa":1.5,"hidratos":7}]'
    + '</code></p>'
    + '<textarea id="pegado" rows="4" aria-label="Pegar datos de alimentos" '
    + 'style="width:100%;font-family:\'IBM Plex Mono\',monospace;font-size:13px;padding:9px;'
    + 'border:1px solid var(--line);border-radius:2px">'+esc(S.pegado||"")+'</textarea>'
    + '<div style="margin-top:10px"><button class="btn" data-act="pegar"'+((S.pegado||"").trim()?"":" disabled")
    + '>Crear desde estos datos</button></div>';
  if (S.aviso) h += '<p class="aviso" style="margin-top:10px">'+esc(S.aviso)+'</p>';
  h += '</div>';
  return h;
}

/* ---------- bloqueo en Edge ---------- */
function esEdge() {
  const ua = navigator.userAgent || "";
  if (/\bEdg(?:e|A|iOS)?\//.test(ua)) return true;
  const uad = navigator.userAgentData;
  if (uad && uad.brands) return uad.brands.some(b => /edge/i.test(b.brand));
  return false;
}
let edgeAceptado = false;

function pantallaEdge() {
  const url = location.href;
  document.getElementById("app").innerHTML =
      '<div class="bloqueo"><div class="caja">'
    + '<h1>Esta app no funciona en Edge</h1>'
    + '<p>No es un capricho técnico: cada navegador guarda sus propios datos y no los comparte con ningún otro. '
    + 'Si registras aquí lo que comes, no aparecerá en Chrome, y acabarás con dos historiales incompletos. '
    + 'Por eso está bloqueada.</p>'
    + '<button class="grande" data-edge="bat">Descargar el atajo para abrirla en Chrome</button>'
    + '<button class="sec" data-edge="copiar">Copiar la dirección</button>'
    + '<p id="edgeMsg" style="min-height:22px;margin:6px 0 14px"></p>'
    + '<p style="font-size:14px;color:#AFC0B8">Una página web no puede lanzar otro navegador por sí sola: '
    + 'ningún navegador lo permite, por seguridad. El atajo es un archivo <code>.bat</code> que contiene '
    + '<code>start chrome "' + esc(url) + '"</code>. Lo descargas, doble clic y Chrome abre la app. '
    + 'Windows puede avisarte de que es un archivo descargado; es normal, lo has generado tú. '
    + 'Si prefieres no descargar nada, copia la dirección y pégala en Chrome.</p>'
    + '<button class="peque" data-edge="seguir">Continuar en Edge de todas formas</button>'
    + '<p style="font-size:13px;color:#AFC0B8;margin-top:4px">Úsalo solo si ya habías guardado datos en Edge '
    + 'y necesitas exportarlos. Los datos de Edge y los de Chrome son distintos.</p>'
    + '</div></div>';
}

/* Al salir de un campo del editor se repinta una vez, para recalcular los avisos. */
document.getElementById("app").addEventListener("change", function (ev) {
  const el = ev.target;
  if (el && el.dataset && el.dataset.ed && S.ed) render();
});

document.getElementById("app").addEventListener("click", function(ev){
  const b = ev.target.closest("[data-edge]"); if (!b) return;
  const msg = document.getElementById("edgeMsg");
  const url = location.href;
  if (b.dataset.edge === "seguir") { edgeAceptado = true; render(); return; }
  if (b.dataset.edge === "copiar") {
    const escribir = navigator.clipboard && navigator.clipboard.writeText
      ? navigator.clipboard.writeText(url) : Promise.reject();
    escribir.then(function(){ msg.innerHTML = '<span class="ok">Dirección copiada. Pégala en Chrome.</span>'; })
      .catch(function(){ msg.innerHTML = 'No he podido copiarla. La dirección es: <code>'+esc(url)+'</code>'; });
    return;
  }
  if (b.dataset.edge === "bat") {
    const bat = '@echo off\r\nrem Abre el registro de comidas en Chrome\r\nstart chrome "' + url + '"\r\n';
    try {
      const blob = new Blob([bat], { type:"application/octet-stream" });
      const u = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = u; a.download = "abrir-registro-en-chrome.bat";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(u); }, 2000);
      msg.innerHTML = '<span class="ok">Atajo descargado. Doble clic y se abre en Chrome.</span>';
    } catch(e) {
      msg.innerHTML = 'No he podido generar el archivo. Copia la dirección y pégala en Chrome.';
    }
  }
});

/* ---------- render y eventos ---------- */
const TABS = [["registro","Registro"],["alimentos","Alimentos"],["peso","Peso"],["ajustes","Ajustes"]];
/* «¿Cabe?» sigue existiendo (vistaViabilidad) pero no se muestra como pestaña. */

function render() {
  try { pintar(); }
  catch (err) {
    document.getElementById("app").innerHTML =
      '<div class="card"><span class="eyebrow">Algo ha fallado al dibujar esta pestaña</span>'
      + '<p class="note" style="margin:8px 0 10px">' + esc(String(err && err.message ? err.message : err))
      + '</p><p class="note">Versión ' + VERSION + '. Tus datos no se han tocado. '
      + 'Prueba otra pestaña, o recarga la página.</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'
      + '<button class="btn" data-act="vista" data-v="registro">Ir a Registro</button>'
      + '<button class="btn ghost" data-act="vista" data-v="ajustes">Ir a Ajustes</button></div></div>';
  }
}

function pintar() {
  if (esEdge() && !edgeAceptado) { pantallaEdge(); return; }
  const activo = document.activeElement;
  const foco = activo && activo.id ? activo.id : null;
  const caret = foco && activo.setSelectionRange ? activo.selectionStart : null;
  let h = hero() + '<div class="tabs">';
  TABS.forEach(function(t){
    h += '<button class="tab'+(S.vista===t[0]?" on":"")+'" data-act="vista" data-v="'+t[0]+'">'+t[1]+'</button>';
  });
  h += '</div>';
  if (S.vista === "registro") {
    const oo = objetivos(S.params);
    const dd = parseIso(S.fecha);
    h += vistaRegistro() + panelRestante(totales(logDe(S.fecha)), esFinde(dd) ? oo.fin : oo.lab, oo);
  }
  else if (S.vista === "alimentos") h += vistaAlimentos();
  else if (S.vista === "peso") h += vistaPeso();
  else if (S.vista === "viabilidad") h += vistaViabilidad();
  else h += vistaAjustes();
  document.getElementById("app").innerHTML = h;
  if (foco) {
    const el = document.getElementById(foco);
    if (el) { el.focus(); if (caret != null && el.setSelectionRange) { try { el.setSelectionRange(caret, caret); } catch(e){} } }
  }
}

document.getElementById("app").addEventListener("change", function (ev) {
